[tool.poetry]
name = "ka11y"
version = "0.1.0"
description = "Accessibility Checker Backend API"
authors = ["pranav"]
readme = "Readme.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
playwright = "^1.49"
pydantic = "^2.10"
pydantic-settings = "^2.7"
nltk = "^3.9"
httpx = "^0.28"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-playwright = "^0.6"
ruff = "^0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
