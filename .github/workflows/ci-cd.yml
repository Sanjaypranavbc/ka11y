  #        DEPLOY_SSH_KEY   private key whose public half is in the host's
  #                         ~/.ssh/authorized_keys — a dedicated deploy key,
  #                         not anyone's personal key
  #        DEPLOY_PATH      absolute path of the ka11y checkout on the host
  #   3. The host must be able to `git pull` without a prompt (deploy key on
  #      the repo, or HTTPS with a token in the git credential store) and the
  #      deploy user must be in the `docker` group.
  #   4. Decide the deploy branch: `main` below; change the `if:` to
  #      refs/heads/live (or whatever the host actually serves) if different.
  #   5. The host's .env is NOT in git; it stays on the host and is read by
