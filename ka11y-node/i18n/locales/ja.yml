# ============================================================
# ka11y — Japanese (日本語) locale
# ============================================================
# Translate the following sections — each key here overrides the
# corresponding English entry in i18n/rules.yml. Leave a value blank or
# omit a key to fall back to English.
#
#   severities       — display labels for severity machine values
#   levels           — display labels for WCAG conformance levels
#   statuses         — display labels for finding status values
#   rules.*.name / description / suggested_fix
#   reason_templates — per-rule reason strings (see top of rules.yml)
#
# Stable machine fields (level, severity, status) come from rules.yml
# and MUST NOT be redefined here.
# ============================================================

version: "1.0"
lang: "ja"

# Severity display labels
severities:
  critical: "重大"
  high: "高"
  medium: "中"
  low: "低"
  none: "なし"

# WCAG level display labels
levels:
  A: "レベル A"
  AA: "レベル AA"
  AAA: "レベル AAA"

# Finding status display labels
statuses:
  pass: "合格"
  fail: "不合格"
  needs_review: "要確認"
  inapplicable: "対象外"

# Per-finding reason templates (JA). Keys mirror i18n/rules.yml exactly.
# Placeholders use {name} interpolation. Missing keys fall back to English.
#
# 文体ガイドライン:
# - 監査レポートは開発者だけでなくコンテンツ担当・デザイナー・QA も読む
#   ため、専門用語（DOM・ARIA・programmatic 等）に依存しない平易な表現で。
# - 失敗時は「何が問題か」「誰に影響するか」「どう直すか」を順に書く。
# - 手動確認時は「何が判定できなかったか」「何を確認すべきか」を書く。
# - 円環的な「WCAG X.Y.Z に違反しています」は避け、実際に何が壊れているか
#   を述べる。
# - HTML 属性名（alt, aria-label など）はエディタで検索できるよう原文を
#   そのまま残してよい。
reason_templates:

  "1.1.1":
    capture_failed:       "画像をキャプチャできなかったため、説明テキストを OCR で検証できませんでした。監査を再実行するか、画像 URL がアクセス可能か確認してください。"
    fail_missing_alt:     "画像に説明（alt 属性）が設定されていません。スクリーンリーダー利用者に内容が伝わりません。何が写っているか／何の操作かを説明する alt 属性を追加してください。"
    pass:                 "画像にはスクリーンリーダーで読み上げ可能な説明があります。"
    decorative_valid:     "装飾画像はスクリーンリーダーから正しく隠されているため、説明は不要です。"
    decorative_invalid:   "装飾扱いの画像に説明テキストが残っています。alt=\"\" にするか、本来意味のある画像であれば aria-hidden / role=\"presentation\" を外してください。"
    functional_redundant: "この画像はラベル付きのボタン／リンクの中にあり、別途の説明は冗長になります。"
    missing_alt:          "画像に alt 属性自体がありません。スクリーンリーダーがファイル名を読み上げるか、画像をスキップしてしまいます。内容を説明する alt=\"…\" を追加してください（純粋な装飾なら alt=\"\"）。"
    generic_alt:          "説明 \"{name}\" は曖昧でスクリーンリーダー利用者に内容が伝わりません。実際に何が写っているかを述べる説明に書き換えてください。"
    logo_valid:           "ロゴの説明 \"{name}\" がブランドや遷移先を明確に示しています。"
    logo_review:          "ロゴと判断されました。説明にブランド名を含めてください（例：「Acme Corp ロゴ」）。"
    icon_terse:           "アイコンの説明 \"{name}\" は短すぎる／曖昧です。見た目ではなく、アイコンが実行する動作（例：「ダイアログを閉じる」）を説明してください。"
    informative_valid:    "画像に明確な説明があります：\"{name}\"。"
    alt_text_mismatch:    "画像には \"{ocr_text}\" という文字が写っていますが、説明（alt）は \"{name}\" となっており内容が一致していません。スクリーンリーダー利用者には画面と異なる情報が伝わります。画像内の文字が伝わる説明に書き換えてください。"
    needs_review_ocr_mismatch: "画像から \"{ocr_text}\" という文字を読み取りましたが、説明（alt）\"{name}\" には含まれていません。その文字が伝えるべき情報かどうかをご確認ください。文字認識は透かしや装飾的な文字も拾うため、代替テキストが不要な場合もあります。"
    needs_review_labeled_control: "この画像を含むリンク／ボタンには既にアクセシブル名があるため、用途は伝わります。ただし画像自体に alt 属性がないため、スクリーンリーダーがファイル名を読み上げる可能性があります。装飾であれば alt=\"\" を、情報を伝えるものであれば説明を追加してください。"
    needs_review_long_description: "この図表は \"{name}\" と識別されていますが、詳細な説明が関連付けられていません。短いラベルだけでは図表が示すデータや傾向は伝わりません。同じ情報が近くのテキストにあるかを確認するか、説明（データテーブル・aria-describedby・キャプションなど）を追加してください。"
    needs_review_decorative_conflict: "この画像は装飾扱い（空の alt、role=\"presentation\"、または aria-hidden）ですが、aria-label・aria-labelledby・title によって名前 \"{name}\" が公開されています。どちらが正しいかを判断してください。装飾ならラベルを削除し、情報を伝えるものなら装飾指定を外して適切な alt を設定してください。"

