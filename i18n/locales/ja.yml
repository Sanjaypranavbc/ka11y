# ============================================================
# ka11y — Japanese (日本語) locale
# ============================================================
# Translate the following sections — each key here overrides the
# corresponding English entry in i18n/rules.yml. Leave a value blank or
# omit a key to fall back to English.
#
#   severities       — display labels for severity machine values
#   levels           — display labels for WCAG conformance levels
#   statuses         — display labels for finding status values
#   rules.*.name / description / suggested_fix
#   reason_templates — per-rule reason strings (see top of rules.yml)
#
# Stable machine fields (level, severity, status) come from rules.yml
# and MUST NOT be redefined here.
# ============================================================

version: "1.0"
lang: "ja"

# Severity display labels
severities:
  critical: "重大"
  high: "高"
  medium: "中"
  low: "低"
  none: "なし"

# WCAG level display labels
levels:
  A: "レベル A"
  AA: "レベル AA"
  AAA: "レベル AAA"

# Finding status display labels
statuses:
  pass: "合格"
  fail: "不合格"
  needs_review: "要確認"
  inapplicable: "対象外"

# Per-finding reason templates (JA). Keys mirror i18n/rules.yml exactly.
# Placeholders use {name} interpolation. Missing keys fall back to English.
reason_templates:

  "1.1.1":
    capture_failed:    "画像のキャプチャに失敗しました — OCR で代替テキストを検証できませんでした。"
    fail_missing_alt:  "画像に十分な alt 属性がありません。"
    pass:              "画像には十分な代替テキストがあります。"

  "1.2.1":
    fail_no_alt:        "収録済みメディアにテキスト代替がありません。"
    needs_review:       "書き起こしの品質について手動確認が必要です。"
    pass:               "収録済みメディアには同等のテキスト代替が提供されています。"

  "1.3.3":
    fail_default:       "指示が知覚的特性（{sensory_categories}）のみに依存しており、非感覚的な識別子がありません。"
    pass_no_records:    "クロール対象に知覚的特性のみに依存する指示は検出されませんでした。"
    pass:               "指示には十分な非感覚的識別子が含まれています。"

  "1.3.4":
    pass: "コンテンツは縦向き・横向きの両方で利用可能です。"

  "1.4.3":
    needs_review_unknown: '画像 "{filename}" 内のテキストについて、OCR のコントラスト判定データが得られなかったため WCAG 1.4.3 AA を検証できませんでした。手動確認が必要です。観測比: {ratio}（前景 {fg_hex} / 背景 {bg_hex}）。'
    fail:                 '画像 "{filename}" 内のテキストは WCAG 1.4.3 AA のコントラスト基準を満たしていません。比率 {ratio}（前景 {fg_hex} / 背景 {bg_hex}）。{text_type} の必要最小値は {threshold}:1 です。'
    pass:                 '{image_label} 内のテキストは WCAG 1.4.3 AA のコントラスト基準を満たしています。比率 {ratio}（前景 {fg_hex} / 背景 {bg_hex}）。'
    capture_failed:       'スクリーンショットのキャプチャに失敗しました（状態: {capture_status}{capture_error_suffix}）。コントラスト解析を実行できませんでした。手動確認が必要です。'

  "1.4.4":
    pass:            "200% に拡大してもテキストが折り返され、コンテンツが失われません。"
    pass_no_records: "テキストのサイズ変更に関する問題は検出されませんでした — 200% でもすべてのコンテンツが正常に表示されます。"

  "1.4.5":
    capture_failed: "画像のキャプチャに失敗しました — OCR で文字の有無を判定できませんでした。"
    fail:           "画像にテキストが含まれています — 実際の CSS スタイル付きテキストに置き換えてください。"
    pass:           "画像にテキストは含まれていません（またはロゴ例外が適用されます）。"

