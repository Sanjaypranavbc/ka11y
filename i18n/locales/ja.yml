    not_interactive:    "この要素はインタラクティブではありません — ターゲットサイズ最小値は適用されません。"

  "3.3.1":
    fail: "フォーム項目が WCAG 3.3.1 に違反しています。"
    pass: "フォーム項目は WCAG 3.3.1 を満たしています。"

  "3.3.2":
    fail: "フォーム項目が WCAG 3.3.2 に違反しています。"
    pass: "フォーム項目は WCAG 3.3.2 を満たしています。"

  "4.1.2":
    capture_failed: "機能的画像のキャプチャに失敗しました — アクセシブル名を検証できませんでした。"
    fail:           "機能的画像に意味のあるアクセシブル名が設定されていません。"
    pass:           "機能的画像に意味のあるアクセシブル名が設定されています。"

  "_generic":
