    fail:                 '画像 "{filename}" 内のテキストは WCAG 1.4.6 AAA 強化コントラスト基準を満たしていません。比率 {ratio}（前景 {fg_hex} / 背景 {bg_hex}）。{text_type} の必要最小値は {threshold}:1 です。'
    pass:                 '{image_label} 内のテキストは WCAG 1.4.6 AAA 強化コントラスト基準を満たしています。比率 {ratio}（前景 {fg_hex} / 背景 {bg_hex}）。'
    capture_failed:       'スクリーンショットのキャプチャに失敗しました（状態: {capture_status}{capture_error_suffix}）。強化コントラスト解析を実行できませんでした。手動確認が必要です。'

  "1.4.10":
    pass:            "320 CSS ピクセル幅でも横スクロールなしでコンテンツが折り返されます。"
    pass_no_records: "リフローに関する問題は検出されませんでした — 狭いビューポートでも正常に表示されます。"

