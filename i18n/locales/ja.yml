    thin_or_low_contrast_focus: "フォーカスインジケーターの太さ（{thickness_px} px）が最小 {min_px} px を下回っており、コントラスト変化も不十分です。手動確認が必要です。"
    low_contrast_focus:         "フォーカスインジケーターのコントラスト比（{contrast}:1）が最小 {min_contrast}:1 を下回っています。"
    valid_focus_appearance:     "フォーカスインジケーターは目立ち、明確に識別できます。"

  "2.5.3":
    fail: "アクセシブル名に視覚ラベルが含まれていません。"
    pass: "アクセシブル名に視覚ラベルが含まれています。"

  "2.5.8":
    fail:               "ターゲットサイズ {width}×{height} px は最小 24×24 px を下回っています。"
    pass:               "ターゲットサイズ {width}×{height} px は最小 24×24 px を満たしています。"
