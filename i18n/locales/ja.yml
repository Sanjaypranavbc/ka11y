    needs_review_unknown: "WCAG {wcag_sc} は手動確認が必要です。"

rules:

  "1.1.1":
    name: "非テキストコンテンツ"
    description: >-
      利用者に提示されるすべての非テキストコンテンツには、同等の目的を果たすテキストによる代替が提供されている。
      装飾的な画像には空のalt属性（alt=""）を使用する。
    suggested_fix: >-
      説明的なalt属性を追加してください: <img alt="画像の説明">。
      純粋に装飾的な画像にはalt=""を使用し、重要なアイコンには aria-label を使用してください。

  "1.2.1":
    name: "音声のみ及び映像のみ（収録済み）"
    description: >-
      収録済みの音声のみのコンテンツ及び映像のみのコンテンツには、同等の情報を提供するテキスト代替または音声トラックが提供されている。
    suggested_fix: >-
      収録済み音声には書き起こしを提供し、映像のみのコンテンツには音声解説トラックまたはテキスト説明を提供してください。

  "1.2.2":
    name: "キャプション（収録済み）"
    description: >-
      同期したメディアに含まれるすべての収録済み音声コンテンツには、キャプションが提供されている。
    suggested_fix: >-
      すべての動画に正確なキャプショントラック（<track kind="captions">）を追加してください。
      自動生成キャプションは必ず人間が確認・修正してください。

  "1.2.3":
    name: "音声解説、又はメディアに対する代替コンテンツ（収録済み）"
    description: >-
      同期したメディアにある収録済み映像コンテンツには、音声解説またはメディアに対する代替コンテンツが提供されている。
    suggested_fix: >-
      映像に映し出される重要な視覚情報を説明する音声解説トラック（<track kind="descriptions">）を追加するか、
      詳細なテキスト記録を提供してください。

  "1.2.4":
    name: "キャプション（ライブ）"
    description: >-
      同期したメディアに含まれるすべてのライブ音声コンテンツには、キャプションが提供されている。
    suggested_fix: >-
      ライブストリームには、リアルタイムキャプションサービス（CART）またはライブキャプションソフトウェアを使用してください。
      aria-live 属性を持つ要素で字幕テキストを更新してください。

  "1.2.5":
    name: "音声解説（収録済み）"
    description: >-
      同期したメディアにある収録済み映像コンテンツには、音声解説が提供されている。
    suggested_fix: >-
      視覚的に重要な情報をすべてナレーターが説明する音声解説バージョンを作成し、
      <track kind="descriptions"> タグで提供してください。

  "1.2.6":
    name: "手話（収録済み）"
    description: >-
      同期したメディアに含まれるすべての収録済み音声コンテンツには、手話通訳が提供されている。
    suggested_fix: >-
      収録済み映像に手話通訳映像を組み込むか、手話通訳動画を別途提供してください（日本語の場合は日本手話）。

  "1.2.7":
    name: "拡張音声解説（収録済み）"
    description: >-
      前景音声の合間に音声解説を挿入する余裕がない場合、収録済み映像コンテンツには拡張音声解説が提供されている。
    suggested_fix: >-
      通常の音声解説で十分な説明ができない場合は、映像を一時停止して詳細な解説を挿入した拡張音声解説バージョンを作成してください。

  "1.2.8":
    name: "メディアに対する代替コンテンツ（収録済み）"
    description: >-
      同期したメディアすべて及び映像のみの収録済みコンテンツには、メディアに対する代替コンテンツが提供されている。
    suggested_fix: >-
      動画の内容を完全に記述した詳細なテキスト記録を、動画の近くまたはリンク先に提供してください。

  "1.2.9":
    name: "音声のみ（ライブ）"
    description: >-
      ライブの音声のみのコンテンツには、同等の情報を提供するテキスト代替が提供されている。
    suggested_fix: >-
      ライブ音声配信にはリアルタイム書き起こしを提供し、aria-live="polite" または aria-live="assertive" で更新してください。

  "1.3.1":
    name: "情報及び関係性"
    description: >-
      見た目で伝えられている構造、情報、および関係性は、プログラムによって解釈可能であるか、テキストで提供されている。
    suggested_fix: >-
      見出しには <h1>〜<h6>、リストには <ul>/<ol>/<li>、表には <table>/<th>/<caption> などの適切なHTML要素を使用してください。
      スタイルだけで情報を伝えないでください。

  "1.3.2":
    name: "意味のある順序"
    description: >-
      コンテンツが提示される順序が意味に影響する場合、正しい読み順がプログラムによって解釈可能である。
    suggested_fix: >-
      DOMの順序が視覚的な読み順と一致するようにし、CSSで表示順序のみを変える場合も論理的なDOM順序を保ってください。
      tabindex の使用は最小限にしてください。

  "1.3.3":
    name: "感覚的な特徴"
    description: >-
      コンテンツを理解して操作するための説明は、形、色、サイズ、視覚的な位置、向き、または音などの感覚的な特徴だけに依存していない。
    suggested_fix: >-
      「右のボタンをクリック」「赤い項目が必須」などの指示を、色・形・位置のみに頼らずテキストラベルと組み合わせて説明してください。

  "1.3.4":
    name: "表示の向き"
    description: >-
      コンテンツは、横向きまたは縦向きといった特定の表示の向きに制限されていない。ただし、特定の表示の向きが必要不可欠な場合は例外。
    suggested_fix: >-
      CSSの orientation メディアクエリや JavaScript で表示を向き固定にしないでください。
      縦・横両方向でレスポンシブに動作するように実装してください。

  "1.3.5":
    name: "入力目的の特定"
    description: >-
      利用者に関する情報を収集する入力フィールドの目的がプログラムによって解釈可能である。
    suggested_fix: >-
      氏名・メールアドレス・電話番号などの入力欄には適切な autocomplete 属性を設定してください
      （例: autocomplete="name"、autocomplete="email"、autocomplete="tel"）。

  "1.3.6":
    name: "目的の特定"
    description: >-
      マークアップ言語で実装されたコンテンツでは、ユーザインタフェース コンポーネント、アイコン、および領域の目的がプログラムによって解釈可能である。
    suggested_fix: >-
      ランドマーク（<header>、<nav>、<main>、<footer>）、role 属性、aria-label を使用して
      ページの各領域とUIコンポーネントの目的を明示してください。

  "1.4.1":
    name: "色の使用"
    description: >-
      情報の伝達、動作の指示、または視覚的要素の区別のために、色だけが唯一の視覚的手段となっていない。
    suggested_fix: >-
      色に加えてアンダーライン、アイコン、パターン、テキストラベルなど他の視覚的手段を組み合わせてください。
      特に必須フィールドのマーク、エラー表示、グラフの凡例などで確認してください。

  "1.4.2":
    name: "音声の制御"
    description: >-
      ウェブページ上で自動的に再生される音声が3秒より長く続く場合、音声を一時停止もしくは停止するか、または音量を調整できる手段が提供されている。
    suggested_fix: >-
      自動再生音声・動画には再生停止ボタンを提供してください。
      <video autoplay> や <audio autoplay> には controls 属性を追加するか、ページ上に明確な停止ボタンを設けてください。

  "1.4.3":
    name: "コントラスト（最低限）"
    description: >-
      テキスト及び文字画像の視覚的提示には、少なくとも4.5:1のコントラスト比がある。
      大きなテキスト（18ポイント以上、または太字14ポイント以上）は3:1以上。
    suggested_fix: >-
      テキストと背景のコントラスト比がWCAG AA基準（通常テキスト4.5:1、大きなテキスト3:1）を満たしているか
      コントラストチェッカーで確認し、必要に応じて色を調整してください。

  "1.4.4":
    name: "テキストのサイズ変更"
    description: >-
      キャプションおよび文字画像を除き、テキストはコンテンツや機能を損なうことなく、支援技術なしで200%までサイズ変更できる。
    suggested_fix: >-
      フォントサイズには px ではなく rem や em を使用してください。
      ブラウザのテキスト拡大（200%）でもレイアウトが崩れないことを確認してください。

  "1.4.5":
    name: "文字画像"
    description: >-
      純粋な装飾、またはテキストが情報伝達に必要不可欠な場合を除き、文字画像ではなくテキストで情報が伝えられている。
    suggested_fix: >-
      画像内のテキストはCSSでスタイリングしたHTMLテキストに置き換えてください。
      ロゴなど例外的に画像が必要な場合は、同じテキスト内容をalt属性で提供してください。

  "1.4.6":
    name: "コントラスト（高度）"
    description: >-
      テキスト及び文字画像の視覚的提示には、少なくとも7:1のコントラスト比がある。
      大きなテキスト（18ポイント以上、または太字14ポイント以上）は4.5:1以上。
    suggested_fix: >-
      WCAG AAAレベルの高いコントラスト基準（通常テキスト7:1、大きなテキスト4.5:1）を満たすよう
      テキストと背景の色の組み合わせを調整してください。

  "1.4.7":
    name: "背景音なし、又は低背景音"
    description: >-
      収録済みの音声のみのコンテンツには、前景音声が含まれ、背景音がないか、背景音がオフにできるか、
      または背景音が前景音声より少なくとも20dB低い。
    suggested_fix: >-
      ナレーションや音声解説の背景音楽は20dB以上小さくするか、完全に除去してください。
      ユーザーが背景音をオフにできる設定を提供してください。

  "1.4.8":
    name: "視覚的表現"
    description: >-
      テキストブロックの視覚的提示において、前景色と背景色が選択できる、幅が80文字以下に限定される、
      テキストが均等割り付けされていない、行間が少なくとも1.5、段落間隔は行間の1.5倍以上などの条件が提供されている。
    suggested_fix: >-
      テキストブロックの最大幅を80文字以下に設定し、行間は1.5em以上、段落間隔は2.25em以上にしてください。
      ユーザーが文字色・背景色を変更できるようにすることを検討してください。

  "1.4.9":
    name: "文字画像（例外なし）"
    description: >-
      文字画像は、純粋な装飾にのみ使用するか、テキストの特定の提示がどうしても必要不可欠な場合のみ使用される。
    suggested_fix: >-
      すべての文字画像をCSSでスタイリングしたHTMLテキストに置き換えてください。
      どうしても必要な場合（ロゴ等）のみ文字画像を使用し、適切なalt属性を設けてください。

  "1.4.10":
    name: "リフロー"
    description: >-
      コンテンツは情報または機能を損なうことなく、320CSSピクセルの幅で（二次元スクロールなしに）提供できる。
    suggested_fix: >-
      レスポンシブデザインを実装し、320px幅でも横スクロールなしにすべてのコンテンツが利用できることを確認してください。
      固定幅のレイアウトや水平スクロールが必要な表はリフロー対応にしてください。

  "1.4.11":
    name: "非テキストのコントラスト"
    description: >-
      ユーザインタフェース コンポーネントおよびグラフィックオブジェクトの視覚的提示には、
      隣接する色に対して少なくとも3:1のコントラスト比がある。
    suggested_fix: >-
      ボタンの枠線、入力フィールドの境界線、チェックボックス、フォーカスインジケーター、
      グラフ・アイコンなどの非テキスト要素が背景に対して3:1以上のコントラスト比を持つようにしてください。

  "1.4.12":
    name: "テキストの間隔"
    description: >-
      以下のテキストの間隔プロパティを変更しても、コンテンツや機能が損なわれない：
      行間1.5以上、段落後の間隔0.5em以上、文字間隔0.12em以上、単語間隔0.16em以上。
    suggested_fix: >-
      CSS上でテキスト間隔をカスタマイズしても、コンテンツが重なったり切れたりしないことを確認してください。
      固定高のコンテナや overflow:hidden の使用を避け、テキストが自然に伸縮できるようにしてください。

  "1.4.13":
    name: "ホバー又はフォーカスで表示されるコンテンツ"
    description: >-
      ポインタホバーまたはキーボードフォーカスによって追加的なコンテンツが表示・非表示になる場合、
      そのコンテンツは解除可能・ホバー可能・永続的である。
    suggested_fix: >-
      ツールチップやドロップダウンは、Escキーで閉じられるようにし、
      マウスをツールチップ上に移動してもコンテンツが消えないようにしてください。
      また、ユーザーが自ら閉じない限り表示し続けてください。

  "2.1.1":
    name: "キーボード"
    description: >-
      コンテンツの全ての機能は、個々のキーストロークに特定のタイミングを必要とするキーボードインタフェースを除き、
      キーボードインタフェースを通じて操作可能である。
    suggested_fix: >-
      すべてのインタラクティブ要素（ボタン、リンク、フォーム、カスタムウィジェット）がTabキーで到達でき、
      Enter/Spaceキーで操作できることを確認してください。
      マウスのみのイベント（mouseover, mousedown）にはキーボード対応も実装してください。

  "2.1.2":
    name: "キーボードトラップなし"
    description: >-
      キーボードインタフェースを使ってページのある部分にキーボードフォーカスを移動できる場合、
      キーボードのみを使ってそのコンポーネントからフォーカスを移動できる。
    suggested_fix: >-
      モーダルダイアログ、カスタムウィジェット、埋め込みコンポーネントからEscキーや
      Tabキーでフォーカスを抜け出せることを確認してください。
      必要なフォーカストラップ（モーダル等）はEscで閉じられるようにしてください。

  "2.1.3":
    name: "キーボード（例外なし）"
    description: >-
      コンテンツの全ての機能は、キーボードインタフェースを通じて操作可能である。例外なし。
    suggested_fix: >-
      パス入力、手書き入力など特殊なジェスチャが必要な機能を含め、
      すべての機能をキーボードだけで操作できるように実装してください。

  "2.1.4":
    name: "文字キーのショートカット"
    description: >-
      文字（大小文字含む）、句読点、数字、または記号のみを使用したキーボードショートカットが実装されている場合、
      オフにする、再マップする、またはフォーカス時のみ有効にする手段が提供されている。
    suggested_fix: >-
      単一文字キーのショートカット（例：「s」で検索）はCtrl/Alt/Metaなどの修飾キーと組み合わせるか、
      ユーザーが無効化または変更できる設定を提供してください。

  "2.2.1":
    name: "タイミング調整可能"
    description: >-
      コンテンツに制限時間が設定されている場合、タイムアウトを延長、調整、または無効にできる手段が提供されている。
    suggested_fix: >-
      セッションタイムアウトは少なくとも20倍に延長するオプションを提供し、
      タイムアウトの直前（残り20秒程度）に警告を表示してください。
      リアルタイム試験など必要不可欠な場合は例外とします。

  "2.2.2":
    name: "一時停止、停止、非表示"
    description: >-
      動くコンテンツ、点滅するコンテンツ、スクロールするコンテンツ、または自動更新するコンテンツには、
      一時停止、停止、または非表示にするための手段が提供されている。
    suggested_fix: >-
      自動再生する動画、スライダー、スクロールテキスト（marquee）、アニメーション等には
      一時停止・停止ボタンを目立つ位置に提供してください。
      CSSアニメーションは prefers-reduced-motion メディアクエリに対応させてください。

  "2.2.3":
    name: "タイミングなし"
    description: >-
      タイミングはコンテンツが提供するイベントまたはアクティビティに不可欠な要素ではない。
      ただしインタラクティブでないビデオ同期メディア及びリアルタイムイベントを除く。
    suggested_fix: >-
      時間制限のあるフォームや操作を再設計し、タイミングを不要にしてください。
      どうしても必要な場合は、2.2.1の要件（調整・延長・無効化）を満たしてください。

  "2.2.4":
    name: "割り込み"
    description: >-
      割り込み（例：緊急情報を除くアップデート情報）は、利用者が延期もしくは抑制することができる。
    suggested_fix: >-
      プッシュ通知、バナーアップデート、自動更新メッセージは緊急情報を除き、
      ユーザーがオフにしたり後に延期したりできる設定を提供してください。

  "2.2.5":
    name: "再認証"
    description: >-
      認証済みのセッションが終了した場合、再認証後にデータを失うことなく利用者は作業を継続できる。
    suggested_fix: >-
      セッションタイムアウト後の再ログイン時に、入力済みのフォームデータや作業内容が
      失われないよう保存・復元する仕組みを実装してください。

  "2.2.6":
    name: "タイムアウト"
    description: >-
      非活動状態が続くと利用者のデータが失われる可能性がある場合、その旨が利用者に警告される。
      ただし、データが20時間以上保存される場合を除く。
    suggested_fix: >-
      非活動によるセッションタイムアウトでデータが失われる前に、ユーザーに事前警告を表示してください。
      「あと5分でセッションが終了します」のような通知を aria-live で実装してください。

  "2.3.1":
    name: "3回のせん光、又はしきい値以下"
    description: >-
      ウェブページには、1秒間に3回を超えて閃光を放つものがない。
      または、閃光が一般的な閃光閾値及び赤色閾値を下回っている。
    suggested_fix: >-
      1秒間に3回を超える閃光や明滅するコンテンツを削除または修正してください。
      どうしても必要な場合は、光感受性発作を引き起こす可能性を事前に警告してください。

  "2.3.2":
    name: "3回のせん光"
    description: >-
      ウェブページには、1秒間に3回を超えて閃光を放つものがない。
    suggested_fix: >-
      すべてのアニメーション、動画、GIF画像で1秒間に3回を超える閃光がないことを確認し、
      必要に応じて閃光の速度を落とすか削除してください。

  "2.3.3":
    name: "インタラクションによるアニメーション"
    description: >-
      インタラクションによって引き起こされるモーションアニメーションは、
      アニメーションが機能や情報伝達に必要不可欠でない限り、無効にできる。
    suggested_fix: >-
      CSSとJavaScriptのアニメーションに @media (prefers-reduced-motion: reduce) を適用し、
      動きに敏感なユーザーのためにアニメーションを無効化または軽減してください。

  "2.4.1":
    name: "ブロックスキップ"
    description: >-
      複数のウェブページで繰り返されているコンテンツのブロックをスキップするメカニズムが利用できる。
    suggested_fix: >-
      ページの先頭に「メインコンテンツへスキップ」などのスキップリンクを追加し、
      <main>、<nav>、<header> などのランドマーク要素を適切に使用してください。

  "2.4.2":
    name: "ページタイトル"
    description: >-
      ウェブページは、主題又は目的を説明するタイトルを持っている。
    suggested_fix: >-
      各ページの <title> 要素に「ページ名 — サイト名」という形式で
      固有かつ説明的なタイトルを設定してください。
      日本語サイトでは区切り文字として「｜」や「—」がよく使われます。

  "2.4.3":
    name: "フォーカス順序"
    description: >-
      ウェブページが順を追ってナビゲートできる場合、フォーカス可能なコンポーネントは
      意味及び操作性を損なわない順序でフォーカスを受け取る。
    suggested_fix: >-
      フォーカスの移動順序が視覚的な読み順と一致するようDOMの順序を整えてください。
      正の tabindex 値の使用を避け、CSSのみで視覚的な並べ替えをしないでください。

  "2.4.4":
    name: "リンクの目的（コンテキスト内）"
    description: >-
      各リンクの目的は、リンクのテキスト単独か、またはプログラムによって解釈可能なリンクコンテキストと合わせて
      判断できる。ただし目的が一般的にあいまいな場合を除く。
    suggested_fix: >-
      「こちら」「詳細」「もっと見る」などのリンクテキストを避け、
      「商品詳細を見る」のように目的がわかるテキストを使用してください。
      必要に応じて aria-label または aria-describedby でコンテキストを補足してください。

  "2.4.5":
    name: "複数の手段"
    description: >-
      一連のウェブページの中で、特定のウェブページを見つけるための手段が2つ以上提供されている。
      ただしそのウェブページがプロセスの結果またはステップである場合は例外。
    suggested_fix: >-
      サイト内検索、サイトマップ、ナビゲーションメニューなど、
      ページに到達するための複数の経路をユーザーに提供してください。

  "2.4.6":
    name: "見出し及びラベル"
    description: >-
      見出し及びラベルは、主題またはその目的を説明している。
    suggested_fix: >-
      見出しはページの内容を正確に説明する具体的なテキストを使用してください。
      フォームラベルは対応する入力の目的を明確に説明してください。
      「クリックしてください」のような汎用的なラベルは避けてください。

  "2.4.7":
    name: "フォーカスの可視化"
    description: >-
      キーボード操作が可能なユーザインタフェースには、
      キーボードフォーカスインジケーターが表示される操作モードがある。
    suggested_fix: >-
      :focus のCSSスタイルを削除しないでください（outline: none は使用しないこと）。
      代わりに :focus-visible を使用してキーボードユーザー向けに明確なフォーカスインジケーターを設け、
      少なくとも2pxのアウトラインと十分なコントラスト比（3:1以上）を確保してください。

  "2.4.8":
    name: "現在位置"
    description: >-
      ウェブページ一式の中における利用者の現在位置に関する情報が提供されている。
    suggested_fix: >-
      パンくずリスト（<nav aria-label="パンくず">）を実装し、
      現在のページをナビゲーションメニューでハイライト（aria-current="page"）してください。
      ページタイトルにもサイト階層を反映させてください。

  "2.4.9":
    name: "リンクの目的（リンクのみ）"
    description: >-
      それぞれのリンクの目的は、リンクのテキスト単独から判断できる。
      ただし目的が一般的にあいまいな場合を除く。
    suggested_fix: >-
      すべてのリンクテキストがリンクのみでも目的を伝えられるようにしてください。
      「こちら」「詳細はこちら」などの汎用テキストは、
      aria-label="商品の詳細はこちら" のように補足してください。

  "2.4.10":
    name: "セクション見出し"
    description: >-
      セクション見出しを使って、コンテンツが整理されている。
    suggested_fix: >-
      コンテンツの各セクションに適切な見出し（<h1>〜<h6>）を使用し、
      階層構造（見出しレベルを飛ばさない）を正しく維持してください。

  "2.4.11":
    name: "フォーカスの非隠蔽（最低限）"
    description: >-
      キーボードフォーカスされたコンポーネントは、利用者が作成したコンテンツによって完全には隠れていない。
    suggested_fix: >-
      固定ヘッダー・フッター・スティッキー要素がフォーカス中の要素を隠さないよう、
      scroll-margin-top や scroll-padding-top でオフセットを設定してください。

  "2.4.12":
    name: "フォーカスの非隠蔽（高度）"
    description: >-
      キーボードフォーカスされたコンポーネントは、いかなるコンテンツによっても隠れていない。
    suggested_fix: >-
      スティッキー要素、オーバーレイ、モーダルなどがフォーカス中の要素を一切隠さないことを確認してください。
      フォーカスを受けた要素が常に完全に可視状態になるようにしてください。

  "2.4.13":
    name: "フォーカスの外観"
    description: >-
      キーボードフォーカスインジケーターは、フォーカスを受けたコンポーネントの周囲を囲み、
      フォーカスした状態とフォーカスしていない状態で3:1以上のコントラスト比を持ち、
      その面積が最小寸法2pxのアウトラインに相当する以上である。
    suggested_fix: >-
      フォーカスインジケーター（通常はアウトライン）が、フォーカス前後で3:1以上のコントラスト比を持ち、
      少なくとも2pxの太さがあることを確認してください。
      CSS の outline: 2px solid に適切な色を設定してください。

  "2.5.1":
    name: "ポインタのジェスチャ"
    description: >-
      複数点のタッチや経路ベースのジェスチャを使って操作するすべての機能は、
      単一ポインタで操作できる代替手段が提供されている。
    suggested_fix: >-
      スワイプ、ピンチズーム、マルチタッチなどのジェスチャ操作を使用する場合は、
      単一タップ・ボタンクリックなどシンプルなポインタ操作でも同じ機能が使えるようにしてください。

  "2.5.2":
    name: "ポインタのキャンセル"
    description: >-
      単一のポインタを使用して操作できる機能は、誤操作を防ぐために
      ダウンイベントで機能を実行しない、アップイベントで取り消しできる、などの条件を満たしている。
    suggested_fix: >-
      重要な操作はpointerdown/mousedownではなく、pointerup/click（mouseup）イベントで実行してください。
      これにより、ユーザーがボタンを押したまま指をずらしてキャンセルできます。

  "2.5.3":
    name: "名前（ラベル）"
    description: >-
      表示ラベルを持つユーザインタフェースコンポーネントには、
      表示ラベルのテキストが名前（accessible name）に含まれている。
    suggested_fix: >-
      ボタンやリンクの aria-label はボタン上に表示されているテキストを含むものにしてください。
      例：「詳細を見る」というボタンに aria-label="商品A詳細を見る" を追加することは問題ありませんが、
      aria-label="View Details" のように表示テキストと全く異なる内容にしないでください。

  "2.5.4":
    name: "動作による起動"
    description: >-
      デバイスの動き（振る、傾けるなど）またはユーザーの動きで操作できる機能は、
      ユーザインタフェースコンポーネントでも操作でき、かつその動作への応答を無効にできる。
    suggested_fix: >-
      デバイスの傾き・振動などで起動する機能には、対応するボタンなどのUI要素も提供し、
      誤動作防止のために動作起動を無効化できる設定を提供してください。

  "2.5.5":
    name: "ターゲットのサイズ（高度）"
    description: >-
      ポインタ入力のターゲットサイズは少なくとも44×44CSSピクセルである。
      ただしインラインや等価なコントロールが存在する場合、間隔が小さい場合は例外。
    suggested_fix: >-
      タップ領域を少なくとも44×44pxにしてください。小さなアイコンボタンには
      透明なパディングでタップ領域を拡張するか、padding を追加してください。

  "2.5.6":
    name: "入力機構の同時提供"
    description: >-
      ウェブコンテンツは利用者が利用する入力機構を制限しない。
      ただしプラットフォームのセキュリティやコンテンツ全体に必要不可欠な場合を除く。
    suggested_fix: >-
      タッチ専用、マウス専用の制限を設けないでください。
      すべての入力方法（タッチ、マウス、キーボード、スタイラス）で操作できるようにしてください。

  "2.5.7":
    name: "ドラッグ動作"
    description: >-
      ドラッグを使った操作には、単一ポインタで操作できる代替手段が提供されている。
      ただしドラッグが必要不可欠な場合を除く。
    suggested_fix: >-
      ドラッグ&ドロップで順序変更や移動ができる場合は、
      「上へ移動」「下へ移動」ボタンなどのシングルクリック代替手段も提供してください。

  "2.5.8":
    name: "ターゲットのサイズ（最低限）"
    description: >-
      ポインタ入力のターゲットサイズは少なくとも24×24CSSピクセルである。
      またはターゲット間のオフセット（余白）がそれを補っている。
    suggested_fix: >-
      タップ領域は最低でも24×24pxにしてください。
      それより小さい場合は、隣接する要素との間隔（オフセット）を加算して
      合計24pxになるようにしてください。

  "3.1.1":
    name: "ページの言語"
    description: >-
      各ウェブページのデフォルト言語がプログラムによって解釈可能である。
    suggested_fix: >-
      <html> タグに lang 属性を設定してください。
      日本語サイトは <html lang="ja">、英語は <html lang="en"> です。
      lang属性がないか誤っていると、スクリーンリーダーが誤った言語で読み上げます。

  "3.1.2":
    name: "部品の言語"
    description: >-
      コンテンツの一部分で使われている言語がプログラムによって解釈可能である。
    suggested_fix: >-
      ページ内で別言語のテキストが含まれる部分には lang 属性を設定してください。
      例：<span lang="en">English text</span> のように、英語が混在する箇所に lang="en" を追加。

  "3.1.3":
    name: "一般的でない用語"
    description: >-
      専門用語、業界用語、イディオム、または方言であるような語句の定義を特定するメカニズムが利用できる。
    suggested_fix: >-
      専門用語や難しい表現には <dfn> タグや注釈、用語集へのリンクを提供してください。
      日本語では、難読漢字や専門用語には reading、furigana（ルビ）や注釈を付けることも有効です。

  "3.1.4":
    name: "略語"
    description: >-
      略語の元の語（または定義）を特定するメカニズムが利用できる。
    suggested_fix: >-
      略語には <abbr title="略語の元の言葉"> を使用してください。
      例：<abbr title="ウェブコンテンツアクセシビリティガイドライン">WCAG</abbr>
      略語の初出には完全な表現を記載してください。

  "3.1.5":
    name: "読解レベル"
    description: >-
      固有名詞及びタイトルを除いてテキストを読むのに、中学校教育レベルを超える能力が必要な場合、
      補助となるコンテンツまたはわかりやすい言語版が利用できる。
    suggested_fix: >-
      難解な専門的表現には、よりわかりやすい説明、図解、または概要（やさしい日本語版）を提供してください。
      「やさしい日本語」ガイドラインを参考に、読みやすいテキストを作成してください。

  "3.1.6":
    name: "発音"
    description: >-
      読み方がないと意味が解別できない語句の、特定の発音を識別するメカニズムが利用できる。
    suggested_fix: >-
      同音異義語や難読漢字には <ruby>（ルビ）要素で読み仮名を提供してください。
      例：<ruby>日本語<rt>にほんご</rt></ruby>
      または発音指示のためのリンクや音声ファイルを提供してください。

  "3.2.1":
    name: "フォーカス時"
    description: >-
      ユーザインタフェースのコンポーネントがフォーカスを受け取ったとき、
      コンテキストの変化が自動的には引き起こされない。
    suggested_fix: >-
      フォーカスを受け取っただけでページ遷移、フォーム送信、または他の重要な変化が
      起きないようにしてください。select 要素の変更でページが移動する場合は
      「適用」ボタンを別途提供してください。

  "3.2.2":
    name: "入力時"
    description: >-
      ユーザインタフェースのコンポーネントの設定を変更することが、コンテキストの変化を
      自動的に引き起こさない。ただし利用者が使用前にそのような動作を知らされている場合は除く。
    suggested_fix: >-
      select ボックスやラジオボタンの選択変更だけで自動的にページ遷移・フォーム送信が
      起きないようにしてください。変更を確定する「適用」や「送信」ボタンを提供してください。

  "3.2.3":
    name: "一貫したナビゲーション"
    description: >-
      ウェブページ一式の中で複数のウェブページ上に繰り返し表示されるナビゲーションメカニズムは、
      毎回同じ相対的な順序で表示される。
    suggested_fix: >-
      ヘッダーナビゲーション、フッターリンク、サイドバーメニューなどは
      全ページで同じ順序・構成を維持してください。
      ページによってナビゲーション要素の順序を変えないでください。

  "3.2.4":
    name: "一貫した識別性"
    description: >-
      ウェブページ一式の中で同じ機能を持つコンポーネントは、一貫した方法で識別される。
    suggested_fix: >-
      同じ機能を持つボタンやアイコンには、サイト全体で同じラベル・テキストを使用してください。
      例えば「検索」ボタンは常に「検索」と表示し、ページによって「探す」「サーチ」と
      変えないようにしてください。

  "3.2.5":
    name: "要求による変化"
    description: >-
      コンテキストの変化は利用者の要求によってのみ引き起こされるか、
      またはそのような変化をオフにするメカニズムが利用できる。
    suggested_fix: >-
      自動でページ更新・リダイレクト・ポップアップが発生するコンテンツは
      ユーザーの明示的な操作によってのみ変化するように変更してください。
      どうしても必要な場合はオフにできる設定を提供してください。

  "3.2.6":
    name: "一貫したヘルプ"
    description: >-
      ウェブページがヘルプメカニズム（人間へのお問い合わせ、自動化ツール、FAQ等）を提供している場合、
      同じ相対的な順序で複数ページにわたって一貫して表示されている。
    suggested_fix: >-
      ヘルプリンク、チャットボット、問い合わせフォームへのリンクは、
      全ページで同じ位置に一貫して表示してください。通常はヘッダーまたはフッターに配置します。

  "3.3.1":
    name: "エラーの特定"
    description: >-
      入力エラーが自動的に検出された場合、エラーになった箇所が特定され、
      エラー内容がテキストで利用者に説明される。
    suggested_fix: >-
      バリデーションエラーは aria-describedby でフィールドとエラーメッセージを関連付け、
      role="alert" または aria-live="assertive" でスクリーンリーダーに通知してください。
      エラーメッセージは「メールアドレスの形式が正しくありません」のように具体的に記述してください。

  "3.3.2":
    name: "ラベル又は説明"
    description: >-
      コンテンツが利用者の入力を要求する場合、ラベルまたは説明が提供されている。
    suggested_fix: >-
      すべての入力欄に <label for="input-id"> を使用してラベルを提供してください。
      必須項目には required または aria-required="true" を設定し、
      プレースホルダーをラベルの代わりに使用しないでください。

  "3.3.3":
    name: "エラー修正の提案"
    description: >-
      入力エラーが自動的に検出され、修正方法が既知の場合、その提案が利用者に提供される。
    suggested_fix: >-
      エラーメッセージには具体的な修正方法を示してください。
      例：「メールアドレスが無効です」ではなく「メールアドレスは「名前@ドメイン」の形式で入力してください」と表示。

  "3.3.4":
    name: "エラー回避（法的、財務的、データ）"
    description: >-
      法律行為、財務的な取引、データの変更・削除などを引き起こすウェブページでは、
      送信が元に戻せる、確認できる、またはエラー確認できる仕組みが提供されている。
    suggested_fix: >-
      購入・削除・契約などの重要な操作には確認ステップを設けてください。
      送信後にキャンセル・修正できる期間を設けるか、「内容を確認して送信」のような
      確認画面を表示してください。

  "3.3.5":
    name: "ヘルプ"
    description: >-
      文脈を踏まえたヘルプが利用できる。
    suggested_fix: >-
      複雑なフォームや手順には、各フィールドの入力例、ヘルプテキスト、FAQ、
      または問い合わせ先へのリンクを提供してください。

  "3.3.6":
    name: "エラー回避（全て）"
    description: >-
      情報の送信を要求するウェブページでは、送信が元に戻せる、確認できる、
      またはエラー確認できる仕組みが提供されている。
    suggested_fix: >-
      すべてのフォーム送信に対して確認・取り消し・修正の手段を提供してください。
      これは3.3.4の要件をすべての送信に拡張したものです。

  "3.3.7":
    name: "冗長な入力"
    description: >-
      同じプロセスのステップで既に入力された情報を再入力する必要がない。
      ただし必要不可欠な場合、またはセキュリティ上の理由を除く。
    suggested_fix: >-
      複数ステップのフォームでは、前のステップで入力した情報（氏名、住所等）を
      自動的に引き継ぎ、同じ情報の再入力を求めないようにしてください。

  "3.3.8":
    name: "アクセシブルな認証（最低限）"
    description: >-
      認証プロセスのいずれかのステップで、認知機能テスト（パズル、文字の記憶など）を
      必要としない。ただし代替手段やオブジェクト認識・個人コンテンツ認識が提供される場合を除く。
    suggested_fix: >-
      ログインには、パズルや複雑なCAPTCHAを必須にせず、
      パスワードマネージャーの利用を可能にし（入力欄を autocomplete 対応にする）、
      生体認証、マジックリンクなどの代替認証手段を提供してください。

  "3.3.9":
    name: "アクセシブルな認証（高度）"
    description: >-
      認証プロセスのいずれかのステップで、認知機能テストを必要としない。
      3.3.8の例外規定も適用されない（オブジェクト認識・個人コンテンツ認識も不可）。
    suggested_fix: >-
      認証においていかなる認知機能テストも必要としない手段（生体認証、パスキー、メールOTPなど）を
      提供してください。「画像の中の信号機をクリック」などのCAPTCHAも除外してください。

  "4.1.1":
    name: "構文解析"
    description: >-
      マークアップ言語を使って実装されているコンテンツは、要素の入れ子構造が正しく、
      id属性が一意であるなど、仕様に従って解析可能である。
      ※WCAG 2.2では廃止（常にpassとして扱われる）。
    suggested_fix: >-
      HTMLバリデーターを使用してマークアップのエラーを確認・修正してください。
      特に要素の閉じ忘れ、不正な入れ子、重複したid属性に注意してください。
      WCAG 2.2ではこの基準は廃止されています。

  "4.1.2":
    name: "名前（name）・役割（role）・値（value）"
    description: >-
      すべてのユーザインタフェースコンポーネントについて、名前（name）および役割（role）は
      プログラムによって解釈可能であり、状態、プロパティ、利用者が設定できる値は
      プログラムによって設定でき、変更はスクリーンリーダーなどの支援技術に通知される。
    suggested_fix: >-
      カスタムUIコンポーネントには role、aria-label/aria-labelledby、aria-expanded、
      aria-checked などの適切なARIA属性を設定してください。
      ネイティブHTMLボタン・入力要素を優先して使用し、
      カスタム要素では全ARIA状態の更新を忘れないようにしてください。

  "4.1.3":
    name: "ステータスメッセージ"
    description: >-
      コンテンツに追加されたステータスメッセージは、フォーカスを受け取らない場合でも、
      役割またはプロパティを通じてプログラムによって解釈可能であり、
      スクリーンリーダーなどの支援技術によって利用者に提示される。
    suggested_fix: >-
      動的に追加されるメッセージ（「送信しました」「エラーが発生しました」「読み込み中」等）は
      role="status" または role="alert"、aria-live="polite" または aria-live="assertive" を
      使用してスクリーンリーダーに通知してください。

axe_rules:
  accesskeys:
    title: "accesskey の一意性"
    suggested_fix: "各 accesskey 属性には一意の文字を割り当ててください。accesskey はブラウザーやスクリーンリーダーのショートカットと競合しやすいため、本当に必要かも見直してください。"
  aria-allowed-role:
    title: "要素に許可された ARIA ロール"
    suggested_fix: "role 属性を削除するか、その要素で許可されているロールに置き換えてください。"
  aria-dialog-name:
    title: "ARIA ダイアログのアクセシブル名"
    suggested_fix: "ダイアログ内の見出しを参照する aria-labelledby、または aria-label を追加してください。"
  aria-text:
    title: "フォーカス可能要素上の ARIA text ロール"
    suggested_fix: "インタラクティブ要素やフォーカス可能な子要素を含む要素から role=\"text\" を削除してください。"
  aria-treeitem-name:
    title: "ARIA treeitem のアクセシブル名"
    suggested_fix: "role=\"treeitem\" を持つ要素には、可視テキストまたは aria-label を追加してください。"
  empty-heading:
    title: "空の見出しなし"
    suggested_fix: "すべての見出しに意味のあるテキストを入れてください。装飾目的だけなら見出し要素をやめて CSS を使ってください。"
  empty-table-header:
    title: "空の表見出しなし"
    suggested_fix: "各 th 要素に説明的なテキストを追加してください。見えない見出しが必要なら空のままではなく visually-hidden クラスを使ってください。"
  focus-order-semantics:
    title: "フォーカス順とセマンティクス"
    suggested_fix: "ネイティブのインタラクティブ要素を使うか、フォーカス可能な要素に適切な ARIA ロールを追加してください。"
  frame-tested:
    title: "axe でテスト可能な iframe"
    suggested_fix: "iframe の内容は別途テストしてください。可能であれば同一オリジンで配信し、自動テストが到達できるようにしてください。"
  heading-order:
    title: "見出しレベルの順序"
    suggested_fix: "見出しレベルは順番どおりに使用してください。見出しのレベルは見た目ではなく文書構造を表すものです。"
  hidden-content:
    title: "非表示コンテンツの確認"
    suggested_fix: "非表示コンテンツを確認し、モーダルがフォーカスを適切に閉じ込めて通知されること、装飾要素だけが aria-hidden=\"true\" になっていることを確認してください。"
  image-redundant-alt:
    title: "冗長でない画像代替テキスト"
    suggested_fix: "画像の役割と同じ可視テキストが隣接している場合、その画像には alt=\"\" を設定して重複読上げを避けてください。"
  label-title-only:
    title: "title のみのラベル禁止"
    suggested_fix: "title 属性だけに頼らず、可視の label 要素を追加してください。title は補足情報として残して構いません。"
  landmark-banner-is-top-level:
    title: "トップレベルのバナーランドマーク"
    suggested_fix: "header 要素または role=\"banner\" の要素を body 直下のトップレベルに移動してください。"
  landmark-complementary-is-top-level:
    title: "トップレベルの補足ランドマーク"
    suggested_fix: "aside 要素は main の子ではなく、ページのトップレベルで main の兄弟要素として配置してください。"
  landmark-contentinfo-is-top-level:
    title: "トップレベルの contentinfo ランドマーク"
    suggested_fix: "footer 要素または role=\"contentinfo\" の要素は、別のランドマークの中ではなく body 直下に配置してください。"
  landmark-main-is-top-level:
    title: "トップレベルの main ランドマーク"
    suggested_fix: "main 要素を body の直接の子要素にしてください。"
  landmark-no-duplicate-banner:
    title: "重複するバナーランドマークなし"
    suggested_fix: "複数のバナーランドマークは 1 つに統合してください。セクション内ヘッダーが必要なら div や文脈上の header を使ってください。"
  landmark-no-duplicate-contentinfo:
    title: "重複する contentinfo ランドマークなし"
    suggested_fix: "フッター情報は 1 つの footer にまとめてください。article や section 内の文脈的フッターは許容されます。"
  landmark-no-duplicate-main:
    title: "重複する main ランドマークなし"
    suggested_fix: "重複した main 要素を削除し、1 つだけ残してください。"
  landmark-one-main:
    title: "main ランドマークは 1 つ"
    suggested_fix: "主たるコンテンツを main 要素で囲んでください。"
  landmark-unique:
    title: "一意なランドマークラベル"
    suggested_fix: "同じ種類のランドマークを複数使う場合は、aria-label を一意にしてください。"
  meta-viewport-large:
    title: "大きなズームを許可する viewport"
    suggested_fix: "maximum-scale の制限を削除するか、少なくとも 5 に設定してください。"
  page-has-heading-one:
    title: "ページに h1 がある"
    suggested_fix: "ページの主題を示す h1 を 1 つ追加してください。"
  presentation-role-conflict:
    title: "フォーカス可能要素の presentation ロール"
    suggested_fix: "フォーカス可能要素に role=\"presentation\" や role=\"none\" を付けないでください。必要なら role を削除するか、その要素をフォーカス不可にしてください。"
  region:
    title: "ランドマーク内のコンテンツ"
    suggested_fix: "主要なコンテンツはランドマーク要素で囲んでください。主コンテンツは main、ナビゲーションは nav を使ってください。"
  scope-attr-valid:
    title: "有効な table header scope"
    suggested_fix: "列見出しには scope=\"col\"、行見出しには scope=\"row\" を使ってください。グループ化見出しには rowgroup や colgroup を使用してください。"
  skip-link:
    title: "スキップリンク"
    suggested_fix: "最初のフォーカス可能要素としてスキップリンクを追加し、リンク先 ID が存在することと、必要なら tabindex=\"-1\" でフォーカスできることを確認してください。"
  tabindex:
    title: "正の tabindex なし"
    suggested_fix: "要素をタブ順に含めるなら tabindex=\"0\"、外すなら tabindex=\"-1\" を使ってください。正の tabindex ではなく DOM 構造を調整してください。"
  table-duplicate-name:
    title: "caption と summary の重複なし"
    suggested_fix: "caption には簡潔な表題を、summary には表の構造説明を設定し、同じ内容の繰り返しを避けてください。"
