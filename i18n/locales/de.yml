# ============================================================
# ka11y — German (Deutsch) locale
# ============================================================
# Translate the following sections — each key here overrides the
# corresponding English entry in i18n/rules.yml. Leave a value blank or
# omit a key to fall back to English.
#
#   severities       — display labels for severity machine values
#   levels           — display labels for WCAG conformance levels
#   statuses         — display labels for finding status values
#   rules.*.name / description / suggested_fix
#   reason_templates — per-rule reason strings (see top of rules.yml)
#
# Stable machine fields (level, severity, status) come from rules.yml
# and MUST NOT be redefined here.
# ============================================================

version: "1.0"
lang: "de"

# Severity display labels
severities:
  critical: "Kritisch"
  high: "Hoch"
  medium: "Mittel"
  low: "Niedrig"
  none: "Keine"

# WCAG level display labels
levels:
  A: "Stufe A"
  AA: "Stufe AA"
  AAA: "Stufe AAA"

# Finding status display labels
statuses:
  pass: "Bestanden"
  fail: "Fehlgeschlagen"
  needs_review: "Prüfung erforderlich"
  inapplicable: "Nicht anwendbar"

# Per-finding reason templates (DE). Keys mirror i18n/rules.yml exactly.
reason_templates:

  "1.1.1":
    capture_failed:    "Bildaufnahme fehlgeschlagen — Alt-Text konnte per OCR nicht überprüft werden."
    fail_missing_alt:  "Dem Bild fehlt ein angemessenes alt-Attribut."
    pass:              "Das Bild verfügt über einen angemessenen Alt-Text."

  "1.2.1":
    fail_no_alt:        "Keine Textalternative für aufgezeichnete Medien."
    needs_review:       "Manuelle Prüfung der Transkriptqualität erforderlich."
    pass:               "Aufgezeichnete Medien verfügen über eine gleichwertige Textalternative."

  "1.3.3":
    fail_default:       "Anweisung stützt sich ausschließlich auf ein sensorisches Merkmal ({sensory_categories}) ohne nicht-sensorische Kennung."
    pass_no_records:    "Keine ausschließlich sensorischen Anweisungen im gecrawlten Inhalt erkannt."
    pass:               "Anweisung enthält ausreichend nicht-sensorische Kennungen."

  "1.3.4":
    pass: "Inhalt ist sowohl im Hoch- als auch im Querformat verfügbar."

  "1.4.3":
    needs_review_unknown: 'Text in Bild "{filename}" konnte für WCAG 1.4.3 AA-Kontrast nicht verifiziert werden, da OCR-Konformitätsdaten fehlen. Manuelle Prüfung erforderlich. Beobachtetes Verhältnis: {ratio} (Vordergrund {fg_hex} auf Hintergrund {bg_hex}).'
    fail:                 'Text in Bild "{filename}" erfüllt WCAG 1.4.3 AA-Kontrast nicht. Verhältnis {ratio} (Vordergrund {fg_hex} auf Hintergrund {bg_hex}). Erforderliches Minimum: {threshold}:1 für {text_type}.'
    pass:                 'Text in {image_label} erfüllt WCAG 1.4.3 AA-Kontrast. Verhältnis {ratio} (Vordergrund {fg_hex} auf Hintergrund {bg_hex}).'
    capture_failed:       'Screenshot-Aufnahme fehlgeschlagen (Status: {capture_status}{capture_error_suffix}) — Kontrastanalyse konnte nicht ausgeführt werden. Manuelle Prüfung erforderlich.'

  "1.4.4":
    pass: "Text läuft bei 200% korrekt um, ohne Verlust von Inhalten."

  "1.4.5":
    capture_failed: "Bildaufnahme fehlgeschlagen — OCR konnte nicht feststellen, ob das Bild Text enthält."
    fail:           "Bild enthält Text — durch echten CSS-formatierten Text ersetzen."
    pass:           "Bild enthält keinen Text (oder Logo-Ausnahme greift)."

  "1.4.6":
    needs_review_unknown: 'Text in Bild "{filename}" konnte für WCAG 1.4.6 AAA verstärkten Kontrast nicht verifiziert werden, da OCR-Daten fehlen. Manuelle Prüfung erforderlich. Beobachtetes Verhältnis: {ratio} (Vordergrund {fg_hex} auf Hintergrund {bg_hex}).'
    fail:                 'Text in Bild "{filename}" erfüllt WCAG 1.4.6 AAA verstärkten Kontrast nicht. Verhältnis {ratio} (Vordergrund {fg_hex} auf Hintergrund {bg_hex}). Erforderliches Minimum: {threshold}:1 für {text_type}.'
    pass:                 'Text in {image_label} erfüllt WCAG 1.4.6 AAA verstärkten Kontrast. Verhältnis {ratio} (Vordergrund {fg_hex} auf Hintergrund {bg_hex}).'
    capture_failed:       'Screenshot-Aufnahme fehlgeschlagen (Status: {capture_status}{capture_error_suffix}) — verstärkte Kontrastanalyse konnte nicht ausgeführt werden. Manuelle Prüfung erforderlich.'

  "1.4.10":
    pass: "Inhalt läuft bei 320 CSS-Pixeln ohne horizontales Scrollen um."

  "1.4.11":
    needs_review: "Kontrast der UI-Komponente konnte nicht automatisch verifiziert werden."
    fail:         "Kontrastverhältnis der UI-Komponente liegt unter dem Minimum von 3:1."
    pass:         "UI-Komponente erfüllt das Kontrastverhältnis von 3:1."

  "1.4.12":
    fail:                 "Element schneidet Text nach Anwendung der Spacing-Overrides ab."
    needs_review_warning: "Feste Höhe mit overflow:hidden kann Text bei größeren Abständen abschneiden."
    needs_review_info:    "Feste Höhe erkannt. Bitte prüfen, dass Text bei größeren Abständen nicht abgeschnitten wird."
    pass_static:          "Kein Risiko von Clipping durch feste Höhe / overflow:hidden festgestellt."
    pass_rendered:        "Nach Anwendung der Spacing-Overrides gehen weder Inhalt noch Funktionalität verloren."

  "1.4.13":
    pass: "Hover-/Fokus-aktivierter Inhalt erfüllt die Anforderungen an Schließbarkeit, Hoverbarkeit und Persistenz."

  "2.2.2":
    fail:         "Automatisch wiedergegebener Inhalt hat keinen Pause-/Stopp-Mechanismus."
    needs_review: "Dauer des bewegten Inhalts konnte nicht automatisch bestimmt werden."
    pass:         "Bewegter Inhalt verfügt über einen Pause-/Stopp-Mechanismus oder eine Ausnahme greift."

  "2.4.11":
    pass: "Kein fokussiertes Element wird vollständig durch autorenseitige Inhalte verdeckt."

  "2.4.12":
    pass: "Kein fokussiertes Element wird (auch nur teilweise) durch autorenseitige Inhalte verdeckt."

  "2.5.3":
    fail: "Zugänglicher Name enthält das sichtbare Label nicht."
    pass: "Zugänglicher Name enthält das sichtbare Label."

  "2.5.8":
    fail: "Zielgröße {width}×{height} px liegt unter dem Minimum von 24×24 px."
    pass: "Zielgröße {width}×{height} px erfüllt das Minimum von 24×24 px."

  "3.3.1":
    fail: "Formularfeld verstößt gegen WCAG 3.3.1."
    pass: "Formularfeld erfüllt WCAG 3.3.1."

  "3.3.2":
    fail: "Formularfeld verstößt gegen WCAG 3.3.2."
    pass: "Formularfeld erfüllt WCAG 3.3.2."

  "4.1.2":
    capture_failed: "Aufnahme des funktionalen Bildes fehlgeschlagen — zugänglicher Name konnte nicht überprüft werden."
    fail:           "Funktionales Bild hat keinen aussagekräftigen zugänglichen Namen."
    pass:           "Funktionales Bild hat einen aussagekräftigen zugänglichen Namen."

  "_generic":
    fail_unknown:         "Seite verstößt gegen WCAG {wcag_sc}."
    needs_review_unknown: "WCAG {wcag_sc} erfordert manuelle Prüfung."

