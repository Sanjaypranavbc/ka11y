
input :
  url: "https://www.kao.com/global/en/"
  max_depth: 0
  output_dir: "crawled_images"

directories:
  - "informative"
  - "decorative"
  - "functional"
  - "functional/buttons"
  - "functional/icons"
  - "functional/logos"
  - "functional/images"
  - "complex"
  - "complex/charts"
  - "complex/emojis"

ocr:
  base_folder: "text_detected"
  contrast_folder: "contrast"

  categories:
    button_text: "button_text"
    informational_text: "informational_text"
    logo_text: "logo_text"
    with_text: "with_text"

browser:
  ignore_https_errors: true

crawler:
  include_data_uris: false
  include_invisible: false
  scroll_passes: 3
  language:
    cjk_langs:
      - "ja"
      - "zh"
      - "zh-CN"
      - "zh-TW"
      - "zh-HK"
      - "ko"
  reporting:
    max_warning_samples: 3
  performance:
    max_focus_steps: 100
    max_hover_candidates: 12
    # Single-page (max_depth=0) OCR budget — unchanged legacy behaviour.
    max_ocr_images_per_run: 60
    # Multi-page crawls: total OCR budget = per_page * num_pages, capped by the
    # ceiling, distributed fairly across pages so a child page isn't starved of
    # image findings by its siblings.
    max_ocr_images_per_page: 60
    max_ocr_images_ceiling: 600


crawl_browser:
  width : 1920
  height: 1080
