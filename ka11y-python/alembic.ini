# Alembic configuration for the ka11y production PostgreSQL schema.
#
#   DATABASE_URL=postgresql://ka11y:ka11y@localhost:5432/ka11y alembic upgrade head
#
# The URL is read from DATABASE_URL in alembic/env.py (never hardcoded here),
# so the same migrations run against a local postgres container and RDS.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
