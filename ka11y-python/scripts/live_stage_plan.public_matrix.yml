runs:
  - id: baseline_example
    url: https://example.com/
    lang: en
    wcag_level: AAA
    max_depth: 0
    notes: Simple baseline page for end-to-end sanity.
    expected_features:
      - baseline_dom
      - no_frames
    run_ocr: false
    run_image_audit: false
    run_resize_text_audit: false
    run_reflow_audit: false
    run_orientation_audit: false
    run_hover_focus_content_audit: false
    run_focus_not_obscured_min_audit: false
    run_focus_not_obscured_enh_audit: false
    expectations:
      min_counts:
        interactive: 1
        target_sizes: 1
      max_snapshot_warnings: 0

  - id: w3schools_bootstrap_forms
    url: https://www.w3schools.com/bootstrap/bootstrap_forms.asp
    lang: en
    wcag_level: AAA
    max_depth: 0
    notes: Public Bootstrap forms page with multiple rendered inputs.
    expected_features:
      - forms
      - labels
    run_ocr: false
    run_image_audit: false
    run_resize_text_audit: false
    run_reflow_audit: false
    run_orientation_audit: false
    run_hover_focus_content_audit: false
    run_focus_not_obscured_min_audit: false
    run_focus_not_obscured_enh_audit: false
    expectations:
      min_counts:
        forms: 6
        interactive: 15
        target_sizes: 15

