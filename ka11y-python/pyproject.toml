[tool.poetry]
name = "ka11y"
version = "0.0.1"
description = "AI Based Web Accessibility Checker"
authors = ["meghana334 <meghanayabaku@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
playwright = ">=1.57.0,<2.0.0"
rich = ">=14.3.1,<15.0.0"
aiohttp = ">=3.13.3,<4.0.0"
bs4 = ">=0.0.2,<0.0.3"
easyocr = ">=1.7.2,<2.0.0"
opencv-python = ">=4.13.0.90,<5.0.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
pydantic = ">=2.12.5,<3.0.0"
logger = ">=1.4,<2.0"
transformers = ">=5.1.0,<6.0.0"
accelerate = ">=1.12.0,<2.0.0"
pillow = ">=12.1.1,<13.0.0"
google-generativeai = ">=0.8.6,<0.9.0"
pyyaml = ">=6.0.3,<7.0.0"
torch = { version = ">=2.10.0,<3.0.0", source = "pytorch-cpu" }
torchvision = { version = ">=0.25.0,<0.26.0", source = "pytorch-cpu" }
pandas = "^3.0.1"
uvicorn = "^0.41.0"
fastapi = "^0.135.1"
httpx = ">=0.28.0,<1.0.0"
pytest = "^9.0.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"