[tool.poetry]
name = "ka11y"
version = "0.0.1"
description = "AI Based Web Accessibility Checker"
authors = ["meghana334 <meghanayabaku@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
playwright = ">=1.57.0,<2.0.0"
rich = ">=14.3.1,<15.0.0"
aiohttp = ">=3.13.3,<4.0.0"
bs4 = ">=0.0.2,<0.0.3"
easyocr = ">=1.7.2,<2.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
pydantic = ">=2.12.5,<3.0.0"
logger = ">=1.4,<2.0"
transformers = ">=4.34.0,<6.0.0"
accelerate = ">=1.12.0,<2.0.0"
pillow = ">=12.1.1,<13.0.0"
google-generativeai = ">=0.8.6,<0.9.0"
pyyaml = ">=6.0.2,<7.0.0"
torch = { version = ">=2.10.0,<3.0.0", source = "pytorch-cpu" }
torchvision = { version = ">=0.25.0,<0.26.0", source = "pytorch-cpu" }
pandas = "^3.0.1"
uvicorn = "^0.41.0"
fastapi = "^0.135.1"
httpx = ">=0.28.0,<1.0.0"
jiwer = ">=3.1.0,<4.0.0"
nltk = ">=3.9.0,<4.0.0"
pytest = "^9.0.2"
pytest-asyncio = "*"
pytest-html = ">=4.1.1,<5.0.0"
spacy = "^3.8.4"
deepgram-sdk = "^7.1.0"
sudachipy = { version = ">=0.6.8,<1.0.0", optional = true }
sudachidict-core = { version = ">=20240409,<99999999", optional = true }
beautifulsoup4 = "^4.14.3"
lxml = "^5.2.0"
yake = "^0.4.8"
# wordfreq must be 3.x: 2.5.x imports the removed `pkg_resources` and is broken
# on Python 3.13 (the runtime here). 3.x dropped that dependency.
wordfreq = ">=3.0.0,<4.0.0"
keybert = "^0.8.4"
sentence-transformers = "^2.7.0"
psutil = "^7.2.2"
tldextract = "^5.3.1"
# New unified Gemini SDK used by enrich_audit.py (google.genai) — a distinct
# package from the older google-generativeai (google.generativeai) above.
google-genai = "^2.14.0"
paddleocr = "^3.7.0"
# Exact pin, not a caret range: paddlepaddle 3.3.x's oneDNN-accelerated CPU
# path crashes on PP-OCR's text-detection model ("NotImplementedError:
# ConvertPirAttribute2RuntimeAttribute not support [...]") — a gap in the
# newer PIR executor's oneDNN kernel coverage. 3.2.2 runs the same models
# correctly with acceleration on. A caret range would let `poetry update`
# silently reintroduce 3.3.x.
paddlepaddle = "==3.2.2"
# Arize observability (ka11y/observability/tracing.py). arize-otel brings the
# OpenTelemetry SDK + OTLP exporters and registers the tracer provider; the
# openinference instrumentor turns every google-genai generate_content() call
# into an LLM span. Both are inert unless ARIZE_SPACE_ID/ARIZE_API_KEY are set.
arize-otel = "^0.13.0"
openinference-instrumentation-google-genai = "^1.4.5"
# Production database (users, sessions, audit jobs, history). PostgreSQL only:
# SQLAlchemy 2.0 async ORM over psycopg 3 (one driver serves both the app's
# async engine and Alembic's sync migrations), Alembic for migrations.
# DATABASE_URL unset → the PG layer is inert and the SQLite run store still works.
sqlalchemy = ">=2.0.40,<3.0.0"
alembic = ">=1.13.0,<2.0.0"
psycopg = { version = ">=3.1.0,<4.0.0", extras = ["binary"] }
# Object storage for audit artifacts (screenshots, HTML snapshots, OCR
# artifacts, JSON/PDF/CSV reports) — ka11y/storage. Local-disk backend needs
# nothing; the S3 backend uses boto3 (credentials from the usual AWS chain).
boto3 = ">=1.34.0,<2.0.0"

[tool.poetry.extras]
japanese = ["sudachipy", "sudachidict-core"]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
# Unified HTML report — generated at tests/report/ka11y_test_report.html on every run.
# Open in a browser after running: poetry run pytest
addopts = [
    "-v",
    "--tb=short",
    "--html=tests/report/ka11y_test_report.html",
    "--self-contained-html",
]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest-html (>=4.2.0,<5.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    # In-process fake S3 for tests/test_storage.py
    "moto[s3] (>=5.0.0,<6.0.0)"
]
