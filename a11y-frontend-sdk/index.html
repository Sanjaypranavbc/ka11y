    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("a11y_theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          // Dark-first: default to dark when the user has no stored preference.
          const shouldUseDark =
            stored === "dark" || (stored === "system" && prefersDark) || !stored;
          if (shouldUseDark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = shouldUseDark ? "dark" : "light";
        } catch {
          // ignore read failures and continue with default theme
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
