# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ka11y-net:
    driver: bridge

# Named volumes hold only re-downloadable model caches. Everything that is
# history lives under ./output/ (see the header) and survives `down -v`.
volumes:
  huggingface_cache:
  paddlex_models:
  easyocr_models:
#  # Phoenix's SQLite trace store, so local traces survive `docker compose down`.
#  phoenix_data:
