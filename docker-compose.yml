# =============================================================================
# ka11y — Docker Compose (project root)
# Services: ka11y-node · ka11y-python · ka11y-frontend · ka11y-docs
#
# Configuration:
#   Operator settings live in `.env` (copy from `.env.example`). Compose
#   substitutes ${VAR} references below at parse time.
#
# Port map (defaults — override via .env):
#   host:8080  → frontend (nginx)     →  internal:80     [PUBLIC]
#   host:8000  → python  (FastAPI)    →  internal:8000   [PUBLIC, X-API-Key gated]
#   host:3000  → node    (axe-core)   →  internal:3000   [LOOPBACK ONLY]
#   host:3001  → docs    (Mintlify)   →  internal:3000   [LOOPBACK ONLY]
#
# Usage:
#   cp .env.example .env && edit                # one-time setup
#   docker compose build --parallel             # build all images in parallel
#   docker compose up -d                        # start in background
#   docker compose logs -f                      # follow logs
#   docker compose down                         # stop services
# =============================================================================

services:

  # ── Node axe-core engine ───────────────────────────────────────────────────
  # Internal-only on EC2: bound to loopback so the public internet cannot
  # hit it. Python reaches it on the Docker network at http://node:3000.
  node:
    build:
      context: ./ka11y-node
      dockerfile: Dockerfile
    image: ka11y-node:latest
    container_name: ka11y-node
    restart: unless-stopped
    shm_size: '256m'
    mem_limit: 1500m

    security_opt:
      - seccomp:unconfined

    networks:
      - ka11y-net

    environment:
      NODE_ENV:       production
      PORT:           "3000"
      AXE_TIMEOUT_MS: "60000"
      BODY_LIMIT:     "10mb"

    ports:
      - "127.0.0.1:${NODE_HOST_PORT:-3000}:3000"

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval:     30s
      timeout:      10s
      start_period: 45s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Python FastAPI auditors ────────────────────────────────────────────────
  # Public on EC2 (browser hits it directly cross-origin). Protected by
  # X-API-Key auth — set KA11Y_API_KEYS in .env to enforce.
  python:
    build:
      context: ./ka11y-python
      dockerfile: Dockerfile
      args:
        INSTALL_JAPANESE: "${INSTALL_JAPANESE:-1}"
        WHISPER_MODEL_SIZE: "${WHISPER_MODEL_SIZE:-base}"
    image: ka11y-python:latest
    container_name: ka11y-python
    restart: unless-stopped
    shm_size: '256m'
    mem_limit: 4g

    security_opt:
      - seccomp:unconfined

    depends_on:
      node:
        condition: service_healthy

    networks:
      - ka11y-net

    environment:
      NODE_BASE_URL:           "http://node:3000"
      KA11Y_API_KEYS:          "${KA11Y_API_KEYS:-}"
      PYTHONUNBUFFERED:        "1"
      PYTHONDONTWRITEBYTECODE: "1"

    ports:
      - "0.0.0.0:${PYTHON_HOST_PORT:-8000}:8000"

    volumes:
      - ./output/crawled_images:/app/crawled_images
      - ./output/logs:/app/logs
      - huggingface_cache:/root/.cache/huggingface

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval:     30s
      timeout:      15s
      start_period: 90s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── React + nginx frontend ─────────────────────────────────────────────────
  # Public on EC2. VITE_API_URL is baked into the JS bundle at build time;
  # rebuild required if it changes.
  frontend:
    build:
      context: ./ka11y-frontend-sdk
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    image: ka11y-frontend:latest
    container_name: ka11y-frontend
    restart: unless-stopped
    mem_limit: 256m

    depends_on:
      python:
        condition: service_healthy

    networks:
      - ka11y-net

    ports:
      - "0.0.0.0:${FRONTEND_HOST_PORT:-8080}:80"

    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval:     30s
      timeout:      5s
      start_period: 15s
      retries:      3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Mintlify documentation site ────────────────────────────────────────────
  # Internal-only on EC2 (loopback). Reach via SSH tunnel:
  #   ssh -L 3001:127.0.0.1:3001 ec2-user@<host>
  docs:
    build:
      context: ./ka11y-docs
      dockerfile: Dockerfile
    image: ka11y-docs:latest
    container_name: ka11y-docs
    restart: unless-stopped
    mem_limit: 512m

    networks:
      - ka11y-net

    ports:
      - "127.0.0.1:${DOCS_HOST_PORT:-3001}:3000"

    volumes:
      - ./ka11y-docs:/docs

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval:     30s
      timeout:      10s
      start_period: 30s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ka11y-net:
    driver: bridge

volumes:
  huggingface_cache:
