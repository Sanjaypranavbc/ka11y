# =============================================================================
# a11y — Docker Compose (project root)
# Services: a11y-node · a11y-python · a11y-frontend · a11y-docs
#
# Port map
#   host:8080  →  frontend (nginx)  →  internal:80
#   host:3001  →  docs (Mintlify)   →  internal:3000
#   host:8000  →  python (FastAPI)  →  internal:8000
#   host:3000  →  node (axe-core)   →  internal:3000  (debug only; not needed by frontend)
#
# Usage:
#   docker compose build --parallel        # build all images in parallel
#   docker compose up                      # start all services
#   docker compose up --build              # build + start
#   docker compose logs -f                 # follow logs
#   docker compose down                    # stop services
#   rm -rf output/crawled_images output/logs  # optional: clear bind-mounted audit output
# =============================================================================

services:

  # ── Node axe-core engine ───────────────────────────────────────────────────
  node:
    build:
      context: ./a11y-node
      dockerfile: Dockerfile
    image: a11y-node:latest
    container_name: a11y-node
    restart: unless-stopped
    shm_size: '256m'

    security_opt:
      - seccomp:unconfined

    networks:
      - a11y-net

    environment:
      NODE_ENV:       production
      PORT:           "3000"
      AXE_TIMEOUT_MS: "60000"
      BODY_LIMIT:     "10mb"

    # Expose to host for local debugging only.
    # The python service reaches node via the internal network (node:3000).
    ports:
      - "0.0.0.0:3000:3000"

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval:     30s
      timeout:      10s
      start_period: 45s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Python FastAPI auditors ────────────────────────────────────────────────
  python:
    build:
      context: ./a11y-python
      dockerfile: Dockerfile
      args:
        # Set to "0" to skip sudachipy/sudachidict + ja_core_news_lg (~500MB).
        INSTALL_JAPANESE: "1"
    image: a11y-python:latest
    container_name: a11y-python
    restart: unless-stopped
    shm_size: '256m'

    security_opt:
      - seccomp:unconfined

    depends_on:
      node:
        condition: service_healthy

    networks:
      - a11y-net

    environment:
      NODE_BASE_URL:        "http://node:3000"
      DEEPGRAM_API_KEY:     "${DEEPGRAM_API_KEY}"
      PYTHONUNBUFFERED:     "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # How long the Node axe task waits for the Python universal snapshot's
      # discovered-URL list before falling back to its budget-capped BFS. Must
      # outlast a slow snapshot (kao.com/jp took ~561s) or deep pages get
      # under-audited. Defaults to the stage timeout (1200s) if unset.
      A11Y_SNAPSHOT_URLS_WAIT_SECONDS: "1200"
      # Overall job timeout in seconds. Defends against deadlocks / hung crawls.
      # For large/heavy multi-page crawls (such as kao.com), increase this budget.
      A11Y_JOB_TIMEOUT_SECONDS: "1800"
      # HTTP read-timeout sizing for the call to Node's /analyse-url-flat. In
      # snapshot-fed mode Node audits every discovered URL with no internal
      # budget, so a fixed 300s client timeout silently dropped ALL axe findings
      # on any child crawl that ran longer. The timeout now scales as
      # base + per_page * page_count, capped at A11Y_JOB_TIMEOUT_SECONDS.
      A11Y_NODE_HTTP_BASE_TIMEOUT_SECONDS: "60"
      A11Y_NODE_HTTP_PER_PAGE_TIMEOUT_SECONDS: "75"

      # ── Durable store (SQLite WAL) + assets + telemetry ──────────────────
      # Source of truth for run state, reports, findings, assets metadata and
      # per-(page,stage,rule) telemetry. Lives on the a11y_db named volume so
      # it survives restarts/redeploys. Back up a11y.db + -wal + -shm together
      # (or use `VACUUM INTO`).
      A11Y_DB_PATH:        "/data/db/a11y.db"
      # Content-addressed asset bytes (screenshots, OCR crops, contrast regions).
      A11Y_ASSET_DIR:      "/data/assets"
      # Delete runs (+ their findings/reports/assets) older than this many days.
      A11Y_RUN_RETENTION_DAYS: "30"
      # Keep telemetry in SQLite only in prod (0) — avoids unbounded JSONL files.
      A11Y_TELEMETRY_FILES: "0"
      # Durable queue: bounded concurrent jobs; crash-requeue attempt cap.
      A11Y_MAX_CONCURRENT_JOBS: "3"
      A11Y_MAX_ATTEMPTS:   "2"
      # True multi-core CPU parallelism for report compression / pure-CPU
      # auditors. Unset/0 = thread fallback (model-based OCR stays on threads).
      A11Y_CPU_WORKERS:    "0"
      # P6 unified crawl: run axe-core inside Playwright (one page load) instead
      # of a second Puppeteer crawl in Node. Default OFF; flip to "1" to trial.
      A11Y_UNIFIED_CRAWL:  "0"

    # Expose to host for local debugging / direct API calls.
    # In production behind a reverse proxy this can be removed.
    ports:
      - "0.0.0.0:8000:8000"

    volumes:
      - ./output/crawled_images:/app/crawled_images
      - ./output/logs:/app/logs
      - ./output/db:/data/db
      - ./output/assets:/data/assets
      - huggingface_cache:/root/.cache/huggingface

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval:     30s
      timeout:      15s
      start_period: 90s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── React + nginx frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./a11y-frontend-sdk
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://a11y-api.bluecaffeine.in" # http:localhost:8000/
    image: a11y-frontend:latest
    container_name: a11y-frontend
    restart: unless-stopped

    depends_on:
      python:
        condition: service_healthy

    networks:
      - a11y-net

    ports:
      - "8080:80"

    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval:     30s
      timeout:      5s
      start_period: 15s
      retries:      3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Mintlify documentation site ────────────────────────────────────────────
  docs:
    build:
      context: ./a11y-docs
      dockerfile: Dockerfile
    image: a11y-docs:latest
    container_name: a11y-docs
    restart: unless-stopped

    networks:
      - a11y-net

    ports:
      - "3001:3000"

    volumes:
      - ./a11y-docs:/docs

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval:     30s
      timeout:      10s
      start_period: 30s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  a11y-net:
    driver: bridge

volumes:
  huggingface_cache:
