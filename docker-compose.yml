# =============================================================================
# ka11y — Docker Compose (project root)
# Services: ka11y-node · ka11y-python · ka11y-frontend · ka11y-docs · ka11y-ui
#
# Port map
#   host:8080  →  ui (Next.js)      →  internal:3001  (frontend, also 8080, stays disabled below)
#   host:8000  →  python (FastAPI)  →  internal:8000
#   host:3000  →  node (axe-core)   →  internal:3000  (debug only; not needed by frontend)
#
# Usage:
#   docker compose build --parallel        # build all images in parallel
#   docker compose up                      # start all services
#   docker compose up --build              # build + start
#   docker compose logs -f                 # follow logs
#   docker compose down                    # stop services (all data is kept)
#
# Persistence: every stateful path is a bind mount under ./output/ — PostgreSQL
# (output/pg: users, sessions, audit history), the SQLite run store (output/db:
# runs, reports, findings, manual verdicts), assets, artifacts, logs and crawled
# images — so `docker compose down` / `up`, `down -v`, `docker volume prune` and
# image rebuilds never lose history. Only the model caches are named volumes.
#   sudo rm -rf output/pg output/db output/assets output/artifacts   # wipe history
#   rm -rf output/crawled_images output/logs                         # clear scratch output
# (`./run.sh --wipe` does both after a confirmation prompt.)
# =============================================================================

services:

  # ── Node axe-core engine ───────────────────────────────────────────────────
  node:
    build:
      context: ./ka11y-node
      dockerfile: Dockerfile
    image: ka11y-node:latest
    container_name: ka11y-node
    restart: unless-stopped
    shm_size: '256m'

    security_opt:
      - seccomp:unconfined

    networks:
      - ka11y-net

    environment:
      NODE_ENV:       production
      PORT:           "3000"
      AXE_TIMEOUT_MS: "60000"
      BODY_LIMIT:     "10mb"

    # Expose to host for local debugging only.
    # The python service reaches node via the internal network (node:3000).
    ports:
      - "0.0.0.0:3000:3000"

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval:     30s
      timeout:      10s
      start_period: 45s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── PostgreSQL — users, OIDC identities, sessions, audit ownership/history ─
  # Local stand-in for Amazon RDS PostgreSQL. In production point DATABASE_URL
  # at the RDS endpoint (add ?sslmode=require) and remove this service; the
  # schema (Alembic, ka11y-python/alembic/) is identical on both.
#  postgres:
#    image: postgres:16-alpine
#    container_name: ka11y-postgres
#    restart: unless-stopped
#
#    networks:
#      - ka11y-net
#
#    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from the same
#    # ka11y-python/.env the python service loads, so one file holds the
#    # credentials and the DATABASE_URL that uses them.
#    env_file:
#      - path: ./ka11y-python/.env
#        required: true
#
#    # Loopback only: nothing outside this host needs the DB.
#    ports:
#      - "127.0.0.1:5432:5432"
#
#    volumes:
#      - ka11y_pg:/var/lib/postgresql/data
#
#    healthcheck:
#      test:         ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
#      interval:     10s
#      timeout:      5s
#      start_period: 20s
#      retries:      10
#
#    logging:
#      driver: json-file
#      options:
#        max-size: "10m"
#        max-file: "5"
  # ── PostgreSQL — users, OIDC identities, sessions, audit history ──────────
  postgres:
    image: postgres:16-alpine
    container_name: ka11y-postgres
    restart: unless-stopped

    networks:
      - ka11y-net

    # PostgreSQL credentials
    env_file:
      - ./ka11y-python/.env

    ports:
      - "127.0.0.1:5432:5432"

    # Bind mount, like every other stateful path in this stack (./output/*):
    # a named volume is deleted by `docker compose down -v` / `docker volume
    # prune`, which is exactly how the audit history kept disappearing. The
    # directory must be empty (or absent) on first start — initdb refuses a
    # non-empty data dir — so never put a .gitkeep in it.
    volumes:
      - ./output/pg:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Python FastAPI auditors ────────────────────────────────────────────────
  python:
    build:
      context: ./ka11y-python
      dockerfile: Dockerfile
      args:
        # Set to "0" to skip sudachipy/sudachidict + ja_core_news_lg (~500MB).
        INSTALL_JAPANESE: "1"
    image: ka11y-python:latest
    container_name: ka11y-python
    restart: unless-stopped
    shm_size: '256m'

    security_opt:
      - seccomp:unconfined

    # Arize/Phoenix tracing is disabled for now — the phoenix service below
    # is commented out, so python must not wait on it.
#    depends_on:
#      # Wait for the collector to be up so the first job's spans aren't dropped
#      # while Phoenix is still booting. required:false keeps this advisory —
#      # `docker compose up python` on its own, or a Phoenix that never turns
#      # healthy, must not stop the audit API from starting.
#      phoenix:
#        condition: service_healthy
#        required: false

#    depends_on:
#      node:
#        condition: service_healthy

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ka11y-net

    environment:
      NODE_BASE_URL:        "http://node:3000"
      DEEPGRAM_API_KEY:     "${DEEPGRAM_API_KEY}"
      # Gemini key for enrich_audit.py's dynamic reason / suggested fix. The
      # enrichment step is best-effort: with this unset the audit still
      # completes, falling back to the static reason/fix on every finding.
      GEMINI_API_KEY:       "${GEMINI_API_KEY}"

      # ── Tracing (Arize AX / Phoenix) — DISABLED for now ─────────────────
      # Hard off regardless of anything in .env; flip to "1" (or remove) and
      # uncomment the block below + the phoenix service to re-enable.
      KA11Y_TRACING_ENABLED: "0"
#      # ── Tracing (ka11y/observability/tracing.py) ─────────────────────────
#      # Traces each Gemini enrichment call (model, input, tokens, latency,
#      # errors) to Arize AX or to the local phoenix service below. Every value
#      # comes from the .env file next to this compose file — no keys here.
#      # Leave them all empty and tracing stays off; the audit is unaffected.
#      ARIZE_SPACE_ID:       "${ARIZE_SPACE_ID:-}"
#      ARIZE_API_KEY:        "${ARIZE_API_KEY:-}"
#      ARIZE_PROJECT_NAME:   "${ARIZE_PROJECT_NAME:-ka11y}"
#      # Arize AX collector override. Applies to the Arize backend only and is
#      # normally empty (the SDK's own otlp.arize.com default).
#      ARIZE_COLLECTOR_ENDPOINT: "${ARIZE_COLLECTOR_ENDPOINT:-}"
#      ARIZE_TRANSPORT:      "${ARIZE_TRANSPORT:-grpc}"
#      # Which backend wins: "phoenix" (local UI on :6006), "arize" (Arize AX),
#      # or unset/"auto" — auto uses Arize AX whenever the credentials above are
#      # set, which is the behaviour this stack had before Phoenix existed.
#      # Flip this one line in .env to switch; credentials stay in place.
#      KA11Y_TRACING_BACKEND: "${KA11Y_TRACING_BACKEND:-}"
#      # Where the local Phoenix listens on the compose network. Service name,
#      # never localhost — localhost inside this container is this container.
#      # Read only when the backend resolves to phoenix; Arize AX ignores it.
#      PHOENIX_COLLECTOR_ENDPOINT: "${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:4317}"

      PYTHONUNBUFFERED:     "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # How long the Node axe task waits for the Python universal snapshot's
      # discovered-URL list before falling back to its budget-capped BFS. Must
      # outlast a slow snapshot (kao.com/jp took ~561s) or deep pages get
      # under-audited. Defaults to the stage timeout (1200s) if unset.
      KA11Y_SNAPSHOT_URLS_WAIT_SECONDS: "1200"
      # Overall job timeout in seconds. Defends against deadlocks / hung crawls.
      # For large/heavy multi-page crawls (such as kao.com), increase this budget.
      KA11Y_JOB_TIMEOUT_SECONDS: "1800"
      # HTTP read-timeout sizing for the call to Node's /analyse-url-flat. In
      # snapshot-fed mode Node audits every discovered URL with no internal
      # budget, so a fixed 300s client timeout silently dropped ALL axe findings
      # on any child crawl that ran longer. The timeout now scales as
      # base + per_page * page_count, capped at KA11Y_JOB_TIMEOUT_SECONDS.
      KA11Y_NODE_HTTP_BASE_TIMEOUT_SECONDS: "60"
      KA11Y_NODE_HTTP_PER_PAGE_TIMEOUT_SECONDS: "75"

      # ── Report email (Gmail SMTP) ────────────────────────────────────────
      # Deep crawls (max_depth 1-2) outlive the browser's wait, so the finished
      # report is emailed with the findings CSV attached instead.
      # Values are substituted from the .env file sitting next to this compose
      # file — NEVER hardcode the password here, this file is committed.
      # SENDER_PASSWORD must be a 16-character Google App Password (requires
      # 2-Step Verification on the sender account), not the account password.
      # With the credentials unset the audit still runs normally and simply
      # logs that the email was skipped.
      SMTP_SERVER:      "${SMTP_SERVER:-smtp.gmail.com}"
      SMTP_PORT:        "${SMTP_PORT:-587}"
      SENDER_EMAIL:     "${SENDER_EMAIL:-}"
      SENDER_PASSWORD:  "${SENDER_PASSWORD:-}"

      # ── Durable store (SQLite WAL) + assets + telemetry ──────────────────
      # Source of truth for run state, reports, findings, assets metadata and
      # per-(page,stage,rule) telemetry. Lives on the ka11y_db named volume so
      # it survives restarts/redeploys. Back up ka11y.db + -wal + -shm together
      # (or use `VACUUM INTO`).
      KA11Y_DB_PATH:        "/data/db/ka11y.db"
      # Content-addressed asset bytes (screenshots, OCR crops, contrast regions).
      KA11Y_ASSET_DIR:      "/data/assets"
      # Delete runs (+ their findings/reports/assets) older than this many days.
      KA11Y_RUN_RETENTION_DAYS: "30"
      # Keep telemetry in SQLite only in prod (0) — avoids unbounded JSONL files.
      KA11Y_TELEMETRY_FILES: "0"
      # Durable queue: bounded concurrent jobs; crash-requeue attempt cap.
      KA11Y_MAX_CONCURRENT_JOBS: "3"
      KA11Y_MAX_ATTEMPTS:   "2"
      # True multi-core CPU parallelism for report compression / pure-CPU
      # auditors. Unset/0 = thread fallback (model-based OCR stays on threads).
      KA11Y_CPU_WORKERS:    "0"
      # P6 unified crawl: run axe-core inside Playwright (one page load) instead
      # of a second Puppeteer crawl in Node. Default OFF; flip to "1" to trial.
      KA11Y_UNIFIED_CRAWL:  "0"

      # ── Production DB (PostgreSQL) + OIDC sign-in ────────────────────────
      # Users, OAuth identities, browser sessions, audit ownership and history
      # (ka11y-python/ka11y/db). Alembic migrations + the WCAG catalogue seed
      # run at startup unless this is "0".
      KA11Y_DB_AUTO_MIGRATE: "1"
      # Everything secret for this block is read from ka11y-python/.env via
      # env_file below (see ka11y-python/.env.example), NOT listed here — an
      # `environment:` entry would override the file with an empty string:
      #   DATABASE_URL                postgresql://<user>:<pw>@postgres:5432/<db>
      #   KA11Y_OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET / _REDIRECT_URI
      #   KA11Y_SESSION_SECRET
      #   KA11Y_ALLOWED_EMAILS / KA11Y_ALLOWED_EMAIL_DOMAINS
      #   KA11Y_COOKIE_SECURE=0       only for plain-http local dev
      # TLS: use docker-compose.tls.yml (Caddy edge, Let's Encrypt, rate limits)
      # or an ALB; an https redirect URI switches on Secure/__Host- cookies,
      # HSTS and the http→https redirect. See SECURITY_HARDENING.md.
      # The redirect URI is the BROWSER-facing UI origin + /api/v1/auth/callback;
      # the ui service rewrites /api/v1/auth/* to this container.
      #
      # Artifact storage (S3) is configured the same way, from ka11y-python/.env:
      #   KA11Y_S3_BUCKET / KA11Y_S3_PREFIX / KA11Y_S3_REGION / KA11Y_S3_SSE
      #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (or an instance/task role)
      # With no bucket the same artifacts stay on the ka11y_assets-style volume
      # below under KA11Y_ARTIFACT_DIR.
      KA11Y_ARTIFACT_DIR:   "/data/artifacts"

    # Expose to host for local debugging / direct API calls.
    # docker-compose.tls.yml withdraws this (only the edge is reachable).
    ports:
      - "0.0.0.0:8000:8000"

    # Required now: it carries DATABASE_URL and the OIDC/session settings.
    env_file:
      - path: ./ka11y-python/.env
        required: true

    volumes:
      - ./output/crawled_images:/app/crawled_images
      - ./output/logs:/app/logs
      - ./output/db:/data/db
      - ./output/assets:/data/assets
      - ./output/artifacts:/data/artifacts
      - huggingface_cache:/root/.cache/huggingface
      # PaddleOCR's detection/recognition/orientation models (~100MB,
      # downloaded lazily on first Japanese-language audit). Without this,
      # every container restart re-downloads them on the next Japanese page.
      - paddlex_models:/root/.paddlex/official_models
      # EasyOCR's detector + recogniser weights (~100MB, downloaded on the
      # first OCR of a run). Persisted so a restart never re-downloads them.
      - easyocr_models:/root/.EasyOCR

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval:     30s
      timeout:      15s
      start_period: 90s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


