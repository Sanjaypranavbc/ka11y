# =============================================================================
# ka11y — Docker Compose (project root)
# Services: ka11y-node · ka11y-python · ka11y-frontend · ka11y-docs
#
# Port map
#   host:8080  →  frontend (nginx)  →  internal:80
#   host:3001  →  docs (Mintlify)   →  internal:3000
#   host:8000  →  python (FastAPI)  →  internal:8000
#   host:3000  →  node (axe-core)   →  internal:3000  (debug only; not needed by frontend)
#
# Usage:
#   docker compose build --parallel        # build all images in parallel
#   docker compose up                      # start all services
#   docker compose up --build              # build + start
#   docker compose logs -f                 # follow logs
#   docker compose down                    # stop services
#   rm -rf output/crawled_images output/logs  # optional: clear bind-mounted audit output
# =============================================================================

services:

  # ── Node axe-core engine ───────────────────────────────────────────────────
  node:
    build:
      context: ./ka11y-node
      dockerfile: Dockerfile
    image: ka11y-node:latest
    container_name: ka11y-node
    restart: unless-stopped
    shm_size: '256m'

    security_opt:
      - seccomp:unconfined

    networks:
      - ka11y-net

    environment:
      NODE_ENV:       production
      PORT:           "3000"
      AXE_TIMEOUT_MS: "60000"
      BODY_LIMIT:     "10mb"

    # Expose to host for local debugging only.
    # The python service reaches node via the internal network (node:3000).
    ports:
      - "0.0.0.0:3000:3000"

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval:     30s
      timeout:      10s
      start_period: 45s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Python FastAPI auditors ────────────────────────────────────────────────
  python:
    build:
      context: ./ka11y-python
      dockerfile: Dockerfile
    image: ka11y-python:latest
    container_name: ka11y-python
    restart: unless-stopped
    shm_size: '256m'

    security_opt:
      - seccomp:unconfined

    depends_on:
      node:
        condition: service_healthy

    networks:
      - ka11y-net

    environment:
      NODE_BASE_URL:        "http://node:3000"
      PYTHONUNBUFFERED:     "1"
      PYTHONDONTWRITEBYTECODE: "1"

    # Expose to host for local debugging / direct API calls.
    # In production behind a reverse proxy this can be removed.
    ports:
      - "0.0.0.0:8000:8000"

    volumes:
      - ./output/crawled_images:/app/crawled_images
      - ./output/logs:/app/logs

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval:     30s
      timeout:      15s
      start_period: 90s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── React + nginx frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./ka11y-frontend-sdk
      dockerfile: Dockerfile
    image: ka11y-frontend:latest
    container_name: ka11y-frontend
    restart: unless-stopped

    depends_on:
      python:
        condition: service_healthy

    networks:
      - ka11y-net

    ports:
      - "8080:80"

    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval:     30s
      timeout:      5s
      start_period: 15s
      retries:      3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # ── Mintlify documentation site ────────────────────────────────────────────
  docs:
    build:
      context: ./ka11y-docs
      dockerfile: Dockerfile
    image: ka11y-docs:latest
    container_name: ka11y-docs
    restart: unless-stopped

    networks:
      - ka11y-net

    ports:
      - "3001:3000"

    volumes:
      - ./ka11y-docs:/docs

    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval:     30s
      timeout:      10s
      start_period: 30s
      retries:      5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ka11y-net:
    driver: bridge
