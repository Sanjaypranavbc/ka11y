stages:
  - install
  - review
  - test
  - build
  - notify

variables:
  NODE_VERSION: "20"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA

# Cache node_modules across jobs in the same pipeline
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# ── Install ──────────────────────────────────────────────────────────────────
install:
  stage: install
  image: node:${NODE_VERSION}-slim
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ── Review ───────────────────────────────────────────────────────────────────
review:
  stage: review
  image: node:${NODE_VERSION}-slim
  needs: [install]
  script:
    - npm run lint --if-present || npx eslint . --ext .js --max-warnings=0
  artifacts:
    when: always
    paths:
      - eslint-report.json
    expire_in: 7 days
  allow_failure: false

# ── Test ─────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: node:${NODE_VERSION}-slim
  needs: [review]
  # Puppeteer/Chromium dependencies
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0
        libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1
        libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0
        libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1
        libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2
        libxrender1 libxss1 libxtst6 wget xdg-utils
      && rm -rf /var/lib/apt/lists/*
  script:
    - npm test -- --ci --forceExit --testTimeout=30000
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - coverage/
    expire_in: 7 days

# ── Build Docker image ────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  needs: [test]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
    - /^release\/.*/

# ── Report test failure as a GitLab Issue ────────────────────────────────────
# Requires: GITLAB_TOKEN CI/CD variable (Project/Personal Access Token, api scope)
report_failure:
  stage: notify
  image: alpine:3.19
  needs:
    - job: test
      artifacts: false
  when: on_failure
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -e

      # ── Fetch failed jobs for this pipeline ──────────────────────────────────
      FAILED_JOBS_JSON=$(curl -sf \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?scope[]=failed")

      FAILED_JOB_NAMES=$(echo "$FAILED_JOBS_JSON" | jq -r '[.[].name] | join(", ")')
      FAILED_JOB_ID=$(echo "$FAILED_JOBS_JSON"   | jq -r '.[0].id')

      # ── Fetch last 50 lines of the failed job log ────────────────────────────
      curl -sf \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$FAILED_JOB_ID/trace" \
        | tail -n 50 > /tmp/job_log.txt

      # ── Build the issue description ──────────────────────────────────────────
      printf '%s\n' \
        "## Pipeline Test Failure Report" \
        "" \
        "| Field | Value |" \
        "|---|---|" \
        "| **Pipeline** | [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL}) |" \
        "| **Branch** | \`${CI_COMMIT_BRANCH}\` |" \
        "| **Commit** | \`${CI_COMMIT_SHORT_SHA}\` — ${CI_COMMIT_TITLE} |" \
        "| **Failed Job(s)** | \`${FAILED_JOB_NAMES}\` |" \
        "" \
        "---" \
        "" \
        "### Error Log — last 50 lines of \`${FAILED_JOB_NAMES}\`" \
        "" \
        "\`\`\`" \
        "$(cat /tmp/job_log.txt)" \
        "\`\`\`" \
        "" \
        "_Auto-generated by GitLab CI · Pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL})_" \
        > /tmp/issue_desc.txt

      # ── Create the GitLab issue ──────────────────────────────────────────────
      curl -sf --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$(jq -n \
          --arg  title "[CI FAILURE] Tests failed in pipeline #${CI_PIPELINE_ID} (${CI_COMMIT_BRANCH})" \
          --rawfile desc /tmp/issue_desc.txt \
          --argjson assignee_id "${GITLAB_USER_ID}" \
          '{title: $title, description: $desc, assignee_ids: [$assignee_id]}')" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues"
