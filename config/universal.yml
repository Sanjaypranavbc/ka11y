version: 1

input:
  url: "https://www.kao.com/global/en/"
  max_depth: 0
  output_dir: "crawled_images"

directories:
  - "informative"
  - "decorative"
  - "functional"
  - "functional/buttons"
  - "functional/icons"
  - "functional/logos"
  - "functional/images"
  - "complex"
  - "complex/charts"
  - "complex/emojis"

ocr:
  base_folder: "text_detected"
  contrast_folder: "contrast"
  categories:
    button_text: "button_text"
    informational_text: "informational_text"
    logo_text: "logo_text"
    with_text: "with_text"

browser:
  ignore_https_errors: true

language:
  supported:
    - "en"
    - "ja"

checks:
  pronunciation:
    cjk_ratio_threshold: 0.05
    ruby_min_coverage_pct: 30
    cjk_lang_prefixes:
      - "ja"
      - "zh"
      - "zh-CN"
      - "zh-TW"
      - "zh-HK"
      - "ko"
      - "zh-hans"
      - "zh-hant"
      - "zh-cn"
      - "zh-tw"
    reason_templates:
      section_low_ruby:
        en: 'Page language is "{html_lang}" but {issue_count} section(s) with explicit CJK lang attributes have low ruby coverage (< {ruby_min_coverage_pct}%): {sample_sections}. Add <ruby> annotations for kanji within these sections.'
        ja: 'ページ言語は "{html_lang}" ですが、明示的な CJK の lang 属性を持つ {issue_count} 件のセクションでルビ率が低すぎます（{ruby_min_coverage_pct}% 未満）: {sample_sections}。これらのセクション内の漢字に <ruby> 注釈を追加してください。'
      not_applicable:
        en: 'Page language is "{html_lang}" with {cjk_density_pct}% CJK characters. WCAG 3.1.6 Pronunciation is not applicable.'
        ja: 'ページ言語は "{html_lang}" で、CJK 文字率は {cjk_density_pct}% です。WCAG 3.1.6 の発音はこのページでは適用対象外です。'
      no_kanji:
        en: 'Page lang="{html_lang}" ({cjk_density_pct}% CJK), but no kanji characters were detected, so ruby annotation is not needed.'
        ja: 'ページの lang="{html_lang}" で CJK 文字率は {cjk_density_pct}% ですが、漢字が検出されなかったためルビ注釈は不要です。'
      pass_with_ruby:
        en: '{ruby_count} <ruby> element(s) were found, covering about {ruby_pct}% of kanji characters on this {html_lang} page.'
        ja: '{html_lang} ページで {ruby_count} 件の <ruby> 要素が見つかり、漢字の約 {ruby_pct}% をカバーしています。'
      low_ruby:
        en: '{ruby_count} <ruby> element(s) were found, but only about {ruby_pct}% of kanji characters are annotated ({kanji_with_ruby}/{kanji_count}). Add furigana for ambiguous or specialist kanji.'
        ja: '{ruby_count} 件の <ruby> 要素が見つかりましたが、注釈されている漢字は約 {ruby_pct}% のみです（{kanji_with_ruby}/{kanji_count}）。あいまいな漢字や専門用語にふりがなを追加してください。'
      missing_ruby:
        en: 'No <ruby> elements were found on this {html_lang} page ({cjk_density_pct}% CJK, {kanji_count} kanji characters). Add ruby/furigana for difficult or ambiguous kanji. Sample text: {sample_text}.'
        ja: '{html_lang} ページで <ruby> 要素が見つかりませんでした（CJK {cjk_density_pct}%、漢字 {kanji_count} 文字）。難読またはあいまいな漢字にルビやふりがなを追加してください。例: {sample_text}。'

