        ja: 'このページに <audio> 要素はありません。'
      pass_detected:
        en: '{audio_count} <audio> element(s) were checked and all appear to have a text alternative.'
        ja: '{audio_count} 件の <audio> 要素を確認し、すべてにテキスト代替があるように見えます。'
      missing_transcript:
        en: '{issue_count} of {audio_count} <audio> element(s) have no detectable text alternative (no <track>, transcript link, <figcaption>, or aria-describedby): {element_list}.'
        ja: '{audio_count} 件の <audio> 要素のうち {issue_count} 件で検出可能なテキスト代替が見つかりませんでした（<track>、書き起こしリンク、<figcaption>、aria-describedby なし）: {element_list}。'

